<div class="container mx-auto p-4">
    <form [formGroup]="detailsForm" (ngSubmit)="onSubmit()" class="space-y-4">
      <!-- Personal Details Section -->
      <div>
        <label class="block text-gray-700">Father Name</label>
        <input type="text" formControlName="fatherName" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
        <div *ngIf="detailsForm.get('fatherName')?.invalid && (detailsForm.get('fatherName')?.dirty || detailsForm.get('fatherName')?.touched)">
          <span class="text-red-600 text-sm">This field is required.</span>
        </div>
      </div>
  
      <div>
        <label class="block text-gray-700">ID Type</label>
        <input type="text" formControlName="idType" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
        <div *ngIf="detailsForm.get('idType')?.invalid && (detailsForm.get('idType')?.dirty || detailsForm.get('idType')?.touched)">
          <span class="text-red-600 text-sm">This field is required.</span>
        </div>
      </div>
  
      <div>
        <label class="block text-gray-700">Date of Birth</label>
        <input type="date" formControlName="dateOfBirth" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
        <div *ngIf="detailsForm.get('dateOfBirth')?.invalid && (detailsForm.get('dateOfBirth')?.dirty || detailsForm.get('dateOfBirth')?.touched)">
          <span class="text-red-600 text-sm">This field is required.</span>
        </div>
      </div>
  
      <div>
        <label class="block text-gray-700">Gender</label>
        <select formControlName="gender" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
          <option value="" disabled>Select Gender</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
          <option value="other">Other</option>
        </select>
        <div *ngIf="detailsForm.get('gender')?.invalid && (detailsForm.get('gender')?.dirty || detailsForm.get('gender')?.touched)">
          <span class="text-red-600 text-sm">This field is required.</span>
        </div>
      </div>
  
      <div>
        <label class="block text-gray-700">ID Number</label>
        <input type="text" formControlName="idNumber" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
        <div *ngIf="detailsForm.get('idNumber')?.invalid && (detailsForm.get('idNumber')?.dirty || detailsForm.get('idNumber')?.touched)">
          <span class="text-red-600 text-sm">This field is required.</span>
        </div>
      </div>
  
      <!-- Additional Verification Section -->
      <div>
        <label class="block text-gray-700">Selfie Photo</label>
        <input type="file" formControlName="selfiePhoto" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
        <div *ngIf="detailsForm.get('selfiePhoto')?.invalid && (detailsForm.get('selfiePhoto')?.dirty || detailsForm.get('selfiePhoto')?.touched)">
          <span class="text-red-600 text-sm">This field is required.</span>
        </div>
      </div>
  
      <div>
        <label class="block text-gray-700">Capture and Upload Your Digital Signature</label>
        <input type="file" formControlName="digitalSignature" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
        <div *ngIf="detailsForm.get('digitalSignature')?.invalid && (detailsForm.get('digitalSignature')?.dirty || detailsForm.get('digitalSignature')?.touched)">
          <span class="text-red-600 text-sm">This field is required.</span>
        </div>
      </div>
  
      <div>
        <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded-md hover:bg-blue-700">Submit</button>
      </div>
    </form>
  </div>
