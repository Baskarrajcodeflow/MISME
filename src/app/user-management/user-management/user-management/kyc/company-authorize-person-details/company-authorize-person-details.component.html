<div class="container mx-auto p-4">
    <form [formGroup]="detailsForm" (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label class="block text-gray-700">Company Authorize Person Details</label>
        <input type="text" formControlName="companyAuthorizePersonDetails" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
        <div *ngIf="detailsForm.get('companyAuthorizePersonDetails')?.invalid && (detailsForm.get('companyAuthorizePersonDetails')?.dirty || detailsForm.get('companyAuthorizePersonDetails')?.touched)">
          <span class="text-red-600 text-sm">This field is required.</span>
        </div>
      </div>
  
      <div>
        <label class="block text-gray-700">Alternative Phone Number</label>
        <input type="text" formControlName="alternativePhoneNumber" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
        <div *ngIf="detailsForm.get('alternativePhoneNumber')?.invalid && (detailsForm.get('alternativePhoneNumber')?.dirty || detailsForm.get('alternativePhoneNumber')?.touched)">
          <span class="text-red-600 text-sm">Please enter a valid phone number.</span>
        </div>
      </div>
  
      <div>
        <label class="block text-gray-700">Address</label>
        <input type="text" formControlName="address" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
        <div *ngIf="detailsForm.get('address')?.invalid && (detailsForm.get('address')?.dirty || detailsForm.get('address')?.touched)">
          <span class="text-red-600 text-sm">This field is required.</span>
        </div>
      </div>
  
      <div>
        <label class="block text-gray-700">Source of Income/Occupation</label>
        <input type="text" formControlName="sourceOfIncomeOccupation" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
        <div *ngIf="detailsForm.get('sourceOfIncomeOccupation')?.invalid && (detailsForm.get('sourceOfIncomeOccupation')?.dirty || detailsForm.get('sourceOfIncomeOccupation')?.touched)">
          <span class="text-red-600 text-sm">This field is required.</span>
        </div>
      </div>
  
      <div>
        <label class="block text-gray-700">Monthly Income</label>
        <input type="text" formControlName="monthlyIncome" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
        <div *ngIf="detailsForm.get('monthlyIncome')?.invalid && (detailsForm.get('monthlyIncome')?.dirty || detailsForm.get('monthlyIncome')?.touched)">
          <span class="text-red-600 text-sm">Please enter a valid income.</span>
        </div>
      </div>
  
      <div>
        <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded-md hover:bg-blue-700">Submit</button>
      </div>
    </form>
  </div>
