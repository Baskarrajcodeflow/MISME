<div class="container mx-auto p-4">
    <form [formGroup]="kinForm" (ngSubmit)="onSubmit()" class="space-y-4">
      <!-- Next of Kin Section -->
      <div>
        <label class="block text-gray-700">Name</label>
        <input type="text" formControlName="name" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
        <div *ngIf="kinForm.get('name')?.invalid && (kinForm.get('name')?.dirty || kinForm.get('name')?.touched)">
          <span class="text-red-600 text-sm">This field is required.</span>
        </div>
      </div>
  
      <div>
        <label class="block text-gray-700">Province</label>
        <input type="text" formControlName="province" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
        <div *ngIf="kinForm.get('province')?.invalid && (kinForm.get('province')?.dirty || kinForm.get('province')?.touched)">
          <span class="text-red-600 text-sm">This field is required.</span>
        </div>
      </div>
  
      <div>
        <label class="block text-gray-700">District</label>
        <input type="text" formControlName="district" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
        <div *ngIf="kinForm.get('district')?.invalid && (kinForm.get('district')?.dirty || kinForm.get('district')?.touched)">
          <span class="text-red-600 text-sm">This field is required.</span>
        </div>
      </div>
  
      <div>
        <label class="block text-gray-700">Phone Number</label>
        <input type="text" formControlName="phoneNumber" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
        <div *ngIf="kinForm.get('phoneNumber')?.invalid && (kinForm.get('phoneNumber')?.dirty || kinForm.get('phoneNumber')?.touched)">
          <span class="text-red-600 text-sm">Please enter a valid phone number.</span>
        </div>
      </div>
  
      <div>
        <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded-md hover:bg-blue-700">Submit</button>
      </div>
    </form>
  </div>
