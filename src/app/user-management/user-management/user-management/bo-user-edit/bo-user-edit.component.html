<div class="container">
  <div class="row">
    <div class="col-md-12 grid-margin stretch-card">
      <div class="card shadow-lg rounded-lg p-6 bg-white">
        <div class="card-body">

          <h3 class="page-title text-2xl font-bold mb-4">
            Back Office User Edit
          </h3>

          <form [formGroup]="backOfficeForm" (ngSubmit)="onSave()">

            <div class="flex flex-wrap -mx-2">

              <!-- Email -->
              <div class="w-full sm:w-1/2 px-2 mb-4">
                <input type="email" formControlName="email"
                  class="w-full px-3 py-2 border rounded"
                  [disabled]="true">
              </div>

              <!-- Username -->
              <div class="w-full sm:w-1/2 px-2 mb-4">
                <input type="text" formControlName="username"
                  class="w-full px-3 py-2 border rounded"
                  [disabled]="true">
              </div>

              <!-- First Name -->
              <div class="w-full sm:w-1/2 px-2 mb-4">
                <label class="block text-gray-700 font-bold mb-2">First Name</label>
                <input type="text" formControlName="firstName"
                  class="w-full px-3 py-2 border rounded">
              </div>

              <!-- Last Name -->
              <div class="w-full sm:w-1/2 px-2 mb-4">
                <label class="block text-gray-700 font-bold mb-2">Last Name</label>
                <input type="text" formControlName="lastName"
                  class="w-full px-3 py-2 border rounded">
              </div>

              <!-- Phone -->
              <div class="w-full sm:w-1/2 px-2 mb-4">
                <label class="block text-gray-700 font-bold mb-2">Phone</label>
                <input type="text" formControlName="phone"
                  class="w-full px-3 py-2 border rounded">
              </div>

              <!-- Branch -->
              <div class="w-full sm:w-1/2 px-2 mb-4">
                <label class="block text-gray-700 font-bold mb-2">Branch</label>
                <select formControlName="branchId"
                  class="w-full px-3 py-2 border rounded"
                  (change)="onSelectBranch($event)">

                  <option value="">Select branch</option>
                  <option *ngFor="let branch of branches" [value]="branch.id + ''">
                    {{ branch?.name }}
                  </option>
                </select>
              </div>

              <!-- Department -->
              <div class="w-full sm:w-1/2 px-2 mb-4">
                <label class="block text-gray-700 font-bold mb-2">Department</label>
                <select formControlName="departmentId"
                  class="w-full px-3 py-2 border rounded"
                  (change)="onSelectDepartment($event)">

                  <option value="">Select department</option>
                  <option *ngFor="let dept of departments" [value]="dept.id + ''">
                    {{ dept.name }}
                  </option>
                </select>
              </div>

              <!-- Role -->
              <div class="w-full sm:w-1/2 px-2 mb-4">
                <label class="block text-gray-700 font-bold mb-2">Role</label>
                <select formControlName="roleData"
                  class="w-full px-3 py-2 border rounded"
                  [compareWith]="compareRole">

                  <option value="">Select role</option>
                  <option *ngFor="let role of roles" [ngValue]="role">
                    {{ role.roleName }}
                  </option>
                </select>
              </div>

              <!-- Buttons -->
              <div class="w-full px-2 mb-4">
                <button type="button" (click)="onCancel()"
                  class="px-4 py-2 bg-gray-300 text-black rounded-md">
                  Cancel
                </button>

                <button type="submit"
                  style="background-color: #0a365a; float:right;"
                  class="px-4 py-2 text-white rounded-md">
                  Update
                </button>
              </div>

            </div>
          </form>

        </div>
      </div>
    </div>
  </div>

  <app-loader *ngIf="isLoading"></app-loader>
</div>
