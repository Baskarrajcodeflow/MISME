<div class="h-full overflow-x-auto overflow-y-auto">
  <div [hidden]="!selected">
      <app-agent-view
          [backOffice]="selected"
         
          (cancel)="onCancel()"
          >
      </app-agent-view>
  </div>
  <div [hidden]="selected">
      <app-search-user (add)="onAdd($event)" *ngIf="agentprivelege?.createPrivelege"></app-search-user>
      <table class="min-w-full bg-white border border-gray-300"  *ngIf="agentprivelege?.readPrivelege">
          <thead style="background-color: rgb(10, 54, 90);">
              <tr>
                  <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider">Email</th>
                  <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider">Username</th>
                  <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider">First Name</th>
                  <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider">Last Name</th>
                  <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider">Phone</th>
                  <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider">Action</th>
                  <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider">Action</th>
              </tr>
          </thead>
          <tbody class="bg-white divide-y divide-gray-200">
              <tr *ngFor="let user of agents" class="hover:bg-gray-100 cursor-pointer">
                  <td class="px-6 py-4 whitespace-nowrap">{{ user.email }}</td>
                  <td class="px-6 py-4 whitespace-nowrap">{{ user.username }}</td>
                  <td class="px-6 py-4 whitespace-nowrap">{{ user.firstName }}</td>
                  <td class="px-6 py-4 whitespace-nowrap">{{ user.lastName }}</td>
                  <td class="px-6 py-4 whitespace-nowrap">{{ user.phone }}</td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900"><button type="button"
                    *ngIf="!user.active && !user.deleted && agentprivelege?.authorizePrivelege"
                    (click)="onClickActive(user)"
                    class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white focus:outline-none focus:ring-2 focus:ring-offset-2"
                    style="background-color: #0a365a;">Activate</button></td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
                  <button type="button" *ngIf="user.active && !user.deleted && agentprivelege?.authorizePrivelege"
                    (click)="onClickDeactive(user)"
                    class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white focus:outline-none focus:ring-2 focus:ring-offset-2"
                    style="background-color: #0a365a;">Deactive</button>
                </td>
              </tr>
          </tbody>
      </table>
  </div>
  <app-loader *ngIf="isLoading"></app-loader>
</div>
