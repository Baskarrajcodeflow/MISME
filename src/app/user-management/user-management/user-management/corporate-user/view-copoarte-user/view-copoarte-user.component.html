<div class="h-full overflow-x-auto overflow-y-auto" >
    <div class="w-full px-2 mb-4" >
        <div >
            <label for="corp" class="block text-gray-700 font-bold mb-2">Select Corporate</label>
              <select (change)="select($event)"
              class=" px-3 py-2 border rounded">
              <option>Select Corporate</option>
              <option *ngFor="let item of corpsData" [value]="item?.id">{{item?.firstName}} {{item?.lastName}} / {{item?.walletAccount?.accountNo}}</option>

          </select>
          </div>
 <div class="-mt-9">
    <button type="submit" 
    (click)="onClickRegister()"
    style="background-color: #0a365a;float: right;"
    class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">
      Register
    </button>
 </div>

      </div>

    <div class="mt-[10px]">
        <table class="min-w-full bg-blue border border-gray-300">
            <thead style="background-color: rgb(10, 54, 90);">
                <tr>
                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider">
                        ID</th>
                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider">
                        Email</th>
                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider">
                        Username</th>
                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider">
                        First Name</th>
                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider">
                        Last Name</th>
                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider">
                        Gender</th>
                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider">
                        Phone</th>
                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider">
                        Wallet No</th>
                </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200">
                <tr *ngFor="let c of corporateUsers" class="hover:bg-gray-100 cursor-pointer">
                    <td class="px-6 py-4 whitespace-nowrap">{{ c.id }}</td>
                    <td class="px-6 py-4 whitespace-nowrap">{{ c.email }}</td>
                    <td class="px-6 py-4 whitespace-nowrap">{{ c.username }}</td>
                    <td class="px-6 py-4 whitespace-nowrap">{{ c.firstName }}</td>
                    <td class="px-6 py-4 whitespace-nowrap">{{ c.lastName }}</td>
                    <td class="px-6 py-4 whitespace-nowrap">{{ c.gender }}</td>
                    <td class="px-6 py-4 whitespace-nowrap">{{ c.phone }}</td>
                    <td class="px-6 py-4 whitespace-nowrap">{{ c.walletAccount.walletNo }}</td>
          

         

                </tr>
            </tbody>
        </table>
    </div>
</div>
<app-loader *ngIf="isLoading"></app-loader>
