<div class="bg-white rounded-xl shadow-md p-6">
  <!-- Header -->
  <div class="flex flex-col md:flex-row md:items-center md:justify-between">
      <div class="mb-4">
    <h2 class="text-xl font-semibold text-[#4a517e]">Create Journal Entry</h2>
    <p class="text-sm text-gray-500">Enter journal transaction details</p>
  </div>

  <div>
    <span class="text-sm font-semibold text-gray-700 mb-1">
      Current Date: <span class="text-gray-600 font-semibold text-md">{{ currentDate | date: 'MM/dd/yyyy' }}</span>
    </span>
  </div>
  </div>

  <!-- Form -->
  <form [formGroup]="journalForm">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
      <!-- Source Account -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Source Account <span class="text-red-500">*</span>
        </label>

        <select
          formControlName="sourceAcc"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-[#4a517e] focus:border-transparent"
          (change)="getCurrentBalanceForSourceAcc($event)"
        >
          <option value="">Select Source Account</option>
          <option
            *ngFor="let acc of accountList"
            [value]="acc.accountNo"
            [disabled]="isSourceDisabled(acc.accountNo)"
          >
            {{ acc?.name }} / {{ acc?.accountNo }}
          </option>
        </select>
         <span class="text-sm font-semibold text-gray-700 mb-1 pt-2">
         Available Balance: <span class="text-green-600 font-semibold text-md">{{ (currentBalance | number: '1.2-2') || '0.00' }}</span>
        </span>
      </div>

      <!-- Destination Account -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Destination Account <span class="text-red-500">*</span>
        </label>

        <select
          formControlName="destinationAcc"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-[#4a517e] focus:border-transparent"
          (change)="getCurrentBalanceForDestinationAcc($event)"
          >
          <option value="">Select Destination Account</option>
          <option
            *ngFor="let accDestination of accountList"
            [value]="accDestination.accountNo"
            [disabled]="isDestinationDisabled(accDestination.accountNo)"
          >
            {{ accDestination?.name }} / {{ accDestination?.accountNo }}
          </option>
        </select>
           <span class="text-sm font-semibold text-gray-700 mb-1 pt-2">
         Available Balance: <span class="text-green-600 font-semibold text-md">{{ (currentBalanceDes | number: '1.2-2') || '0.00' }}</span>
        </span>
      </div>

      <!-- Amount -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Amount <span class="text-red-500">*</span>
        </label>

        <input
          type="number"
          formControlName="amount"
          placeholder="Enter Amount"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-[#4a517e] focus:border-transparent"
        />
      </div>

      <!-- Reference Number -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          External Reference Number <span class="text-red-500">*</span>
        </label>

        <input
          type="text"
          formControlName="refNumber"
          placeholder="Enter External Reference Number"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-[#4a517e] focus:border-transparent"
        />
      </div>
    </div>

    <!-- Description Full Width -->
    <div class="mt-5">
      <label class="block text-sm font-medium text-gray-700 mb-1">
        Description <span class="text-red-500">*</span>
      </label>

      <textarea
        rows="3"
        formControlName="description"
        placeholder="Enter Description"
        class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-[#4a517e] focus:border-transparent"
      ></textarea>
    </div>

    <!-- Buttons -->
    <div class="flex justify-end gap-3 mt-6">
      <button
        (click)="navigateToJournalEntries()"
        type="button"
        class="px-5 py-2 rounded-lg border border-gray-300 text-gray-600 hover:bg-gray-50"
      >
        Cancel
      </button>

      <button
        (click)="submitForm()"
        type="submit"
        [disabled]="journalForm.invalid"
        class="px-6 py-2 rounded-lg bg-[#4a517e] text-white hover:bg-[#3b4164] shadow-sm disabled:opacity-50"
      >
        Create Entry
      </button>
    </div>
  </form>
</div>

<app-loader *ngIf="isLoading"></app-loader>
