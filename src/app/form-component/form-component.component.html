<form [formGroup]="formName" class="max-w-md mx-auto">
    <div *ngFor="let control of formControls" class="mb-4">
      <label [for]="control.key" class="block text-gray-700 text-sm font-bold mb-2">{{ control.label }}</label>
      <input [type]="control.type" [id]="control.key" [formControlName]="control.key" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
<!--       <div *ngIf="customerKycForm.get(control.key).invalid && customerKycForm.get(control.key).touched" class="text-red-500 text-xs italic">{{ control.error }}</div>
 -->    </div>
    <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">Submit</button>
  </form>
