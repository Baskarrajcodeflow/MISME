<div class="h-full overflow-x-auto overflow-y-auto" *ngIf="SalaryPrivelege?.readPrivelege">
  <table class="min-w-full bg-blue border border-gray-300">
    <thead style="background-color: rgb(10, 54, 90)">
      <tr>
        <th
          scope="col"
          class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider"
        >
          Batch Id
        </th>
        <th
          scope="col"
          class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider"
        >
          File Name
        </th>
        <th
          scope="col"
          class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider"
        >
          Uploaded Date
        </th>
        <th
          scope="col"
          class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider"
        >
          Corporate Name
        </th>
        <th
          scope="col"
          class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider"
        >
          Approval Status
        </th>
        <th *ngIf="SalaryPrivelege?.authorizePrivelege" scope="col" class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider">Action</th>
      </tr>
    </thead>
    <tbody class="bg-white divide-y divide-gray-200">
      <tr
        *ngFor="let item of bulkSalaryData"
        class="hover:bg-gray-100 cursor-pointer divide-x divide-gray-200"
      >
        <ng-container
          *ngIf="
            item?.status == 'WAITING_FOR_FINAL_APPROVAL'
          "
        >
          <td class="px-6 py-4 whitespace-nowrap">{{ item.id }}</td>
          <td class="px-6 py-4 ">{{ item.fileName }}</td>
          <td class="px-6 py-4 whitespace-nowrap">
            {{ item.uploadedTime | date : "MMM d, y, h:mm:ss a" }}
          </td>
          <td class="px-6 py-4 whitespace-nowrap">{{ item.corpName }}</td>
          <td class="px-6 py-4 whitespace-nowrap text-right">
         <div class="flex "> 
          <span
          [ngClass]="{
            'bg-yellow-100 text-yellow-700': item?.status == 'WAITING_FOR_FINAL_APPROVAL',
          }"
          class="px-3 py-1 rounded-full font-medium text-xs inline-block"
        >
          <ng-container *ngIf="item.status == 'WAITING_FOR_FINAL_APPROVAL'">
            Final Approval Pending
          </ng-container>
        </span>

         </div>
          </td>
          <td *ngIf="SalaryPrivelege?.authorizePrivelege"  class="px-6 py-4 whitespace-nowrap">
            <button (click)="sendOtp(item.id)"
  class="px-2 py-1 rounded-lg text-white font-medium shadow-md hover:shadow-lg hover:bg-gray-700 transition duration-200"
  style="background-color: rgb(10, 54, 90);"
>
  Authorize
</button>
</td>
          
        </ng-container>
      </tr>
    </tbody>
  </table>
</div>

<div *ngIf="showOTP" class="fixed inset-0 flex items-center justify-center z-50">
    <!-- Background blur + dark overlay -->
    <div class="absolute inset-0 bg-black bg-opacity-40 backdrop-blur-sm"></div>

    <!-- Modal content -->
    <div class="relative z-10">
      <app-otp-modal
        [show]="showOTP"
        [digits]="6"
        [title]="'Verify OTP'"
        [subtitle]="'Enter the 6-digit code'"
        (submitted)="onOtpSubmit($event)"
        (closed)="showOTP = false">
      </app-otp-modal>
    </div>
  </div>
<app-loader *ngIf="isLoading"></app-loader>
