<div class="min-w-full bg-white border border-gray-300" *ngIf="subagentPrivilege?.readPrivelege">
  <table class="min-w-full bg-white border border-gray-300">
    <thead>
      <tr class="border-b border-gray-300 bg-gray-800">
        <th
          *ngFor="let col of columns"
          class="px-6 py-3 text-center text-white"
        >
          {{ col.header }}
        </th>
        <th *ngIf="bulkEditMode" class="px-6 py-3 text-white">Select</th>
        <th class="px-6 py-3 text-white">Actions</th>
      </tr>
      <tr class="bg-gray-50">
        <td *ngFor="let col of columns" class="px-2 py-3">
          <input
            *ngIf="col.type != 'dropdown' && col.type != 'none' && col.type != 'selectbox' && col.type != 'conversionTypeBox'"
            [(ngModel)]="newRow[col.field]"
            placeholder="{{ col.header }}"
            class="w-full px-2 py-1 border border-gray-300 rounded focus:outline-none focus:border-blue-500"
          />
          <select
            *ngIf="col.type == 'dropdown'"
            [(ngModel)]="newRow[col.field]"
            class="w-full px-2 py-1 border border-gray-300 rounded focus:outline-none focus:border-blue-500"
          >
            <option disabled>Select an option</option>
            <option *ngFor="let type of amountType">{{ type }}</option>
          </select>
           <select
            *ngIf="col.type == 'selectbox'"
            [(ngModel)]="newRow[col.field]"
            class="w-full px-2 py-1 border border-gray-300 rounded focus:outline-none focus:border-blue-500"
          >
            <option disabled>Select an option</option>
            <option *ngFor="let type of calcType">{{ type }}</option>
          </select>
           <select
            *ngIf="col.type == 'conversionTypeBox'"
            [(ngModel)]="newRow[col.field]"
            class="w-full px-2 py-1 border border-gray-300 rounded focus:outline-none focus:border-blue-500"
          >
            <option disabled>Select an option</option>
            <option *ngFor="let type of conversionType">{{ type }}</option>
          </select>
        </td>
        <td
          class="px-2 py-3 float-start"
          *ngIf="
            headerTitle == 'AmountLimit' ||
            headerTitle == 'cashBack' ||
            headerTitle == 'Service' ||
            headerTitle == 'transactionLimit' ||
            headerTitle == 'tax' ||
            headerTitle == 'Charges' ||
            headerTitle == 'Loyalty' ||
            headerTitle == 'Points To Money' ||
            headerTitle == 'AFC'
          "
        >
          <button
          *ngIf="subagentPrivilege?.createPrivelege"
            (click)="onAddRow(newRow)"
            class="px-4 py-2 text-white bg-tableHheaderBlue rounded hover:bg-blue-600 focus:outline-none focus:bg-blue-600"
          >
            Add
          </button>
        </td>
        <td class="px-2 py-3" *ngIf="headerTitle == 'listSubProduct'">
          <div 
       
           class="float-right">
            <button  *ngIf="subagentPrivilege?.createPrivelege"
              (click)="route()"
              type="submit"
              class="bg-blue-500 text-white py-1 px-3 rounded hover:bg-blue-700"
            >
              Create Sub-Product
            </button>
          </div>
        </td>
        <td class="px-2 py-3" *ngIf="headerTitle == 'MasterProduct'">
           <div 
         
          class="float-right">
            <button  *ngIf="subagentPrivilege?.createPrivelege"
              (click)="routeProduct()"
              type="submit"
              class="bg-blue-500 text-white py-1 px-3 rounded hover:bg-blue-700"
            >
              Create Product
            </button>
          </div>
        </td>
        <td class="px-2 py-3" *ngIf="headerTitle == 'ListAFC'">
          <div class="float-right">
            <button
              (click)="createAFC()"
              type="submit"
              class="bg-blue-500 text-white py-1 px-3 rounded hover:bg-blue-700"
            >
              Create
            </button>
          </div>
        </td>
      </tr>
    </thead>
    <tbody>
      <tr
        *ngFor="let row of rows; let i = index"
        class="border-b border-gray-200 odd:bg-white even:bg-gray-100"
      >
        <td *ngFor="let col of columns" class="px-6 py-4">
          <div *ngIf="editIndex !== i; else editTemplate">
            {{ row[col.field] }}
          </div>
          <ng-template #editTemplate>
            <input
              *ngIf="col.type != 'dropdown' && col.type != 'selectbox'"
              [(ngModel)]="row[col.field]"
              list="names"
              name="name"
              class="block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50"
              placeholder="Select a name"
            />
            <select
              *ngIf="col.type == 'dropdown'"
               [(ngModel)]="row[col.field]"
              class="w-full px-2 py-1 border border-gray-300 rounded focus:outline-none focus:border-blue-500"
            >
              <option disabled>Select an option</option>
              <option *ngFor="let type of amountType">{{ type }}</option>
            </select>
             <select
              *ngIf="col.type == 'selectbox'"
               [(ngModel)]="row[col.field]"
              class="w-full px-2 py-1 border border-gray-300 rounded focus:outline-none focus:border-blue-500"
            >
              <option disabled>Select an option</option>
              <option *ngFor="let type of calcType">{{ type }}</option>
            </select>
            <select
              *ngIf="col.type == 'conversionTypeBox'"
               [(ngModel)]="row[col.field]"
              class="w-full px-2 py-1 border border-gray-300 rounded focus:outline-none focus:border-blue-500"
            >
              <option disabled>Select an option</option>
              <option *ngFor="let type of conversionType">{{ type }}</option>
            </select>
          </ng-template>
          
        </td>
        <td *ngIf="bulkEditMode" class="px-6 py-4 text-center">
          <input type="checkbox" [(ngModel)]="row.selected" />
        </td>
        <td
          class="px-6 py-4 flex gap-2"
          style="float: inline-end"
          *ngIf="
            headerTitle != 'listSubProduct' &&
            headerTitle != 'EditlistSubProduct' &&
            headerTitle != 'MasterProduct' &&
            headerTitle != 'ListAFC' 
          "
        >
      <ng-container *ngIf="subagentPrivilege?.updatePrivelege">
        <img
        src="../../assets/icons/edit.png"
        *ngIf="editIndex !== i"
        (click)="editIndex = i"
        matTooltip="Edit"
        matTooltipPosition="above"
        style="cursor: pointer"
        height="25px"
        width="25px"
      />
      </ng-container>
      
    <ng-container
    *ngIf="subagentPrivilege?.updatePrivelege">
      <button 
      (click)="editRow(row, i)"
      *ngIf="editIndex === i"
      (click)="editIndex = null"
      class="bg-green-500 hover:bg-green-700 px-2 py-1 text-white rounded"
    >
      Save
    </button>
    </ng-container>
    

        <!-- <ng-container 
        *ngIf="subagentPrivilege?.deletePrivelege">
          <img
          style="cursor: pointer"
          matTooltip="Delete"
          matTooltipPosition="above"
          (click)="deleteRow(row, i)"
          src="../../assets/icons/delete.png"
          alt=""
          height="25px"
          width="25px"
        />
        </ng-container> -->
        
        </td>
        <td
          class="px-6 py-4 flex gap-4"
          style="float: inline-end"
          *ngIf="
            headerTitle == 'listSubProduct' ||
            headerTitle == 'EditlistSubProduct' ||
            headerTitle == 'MasterProduct' ||
            headerTitle == 'ListAFC' 
          "
        >
        <ng-container
        *ngIf="subagentPrivilege?.updatePrivelege">
          <img
            matTooltip="Edit"
            matTooltipPosition="above"
            style="cursor: pointer"
            (click)="editRowData(row, i)"
            src="../../assets/icons/edit.png"
            alt=""
            height="25px"
            width="25px"
          />
        </ng-container>
        <!-- <ng-container
        *ngIf="subagentPrivilege?.deletePrivelege">
          <img
          style="cursor: pointer"
          matTooltip="Delete"
          matTooltipPosition="above"
          (click)="deleteRow(row, i)"
          src="../../assets/icons/delete.png"
          alt=""
          height="25px"
          width="25px"
        />
        </ng-container> -->
        
       
        </td>
      </tr>
    </tbody>
  </table>
  <div class="flex justify-end mt-4 space-x-2">
    <!-- <button
      (click)="toggleBulkEditMode()"
      class="px-4 py-2 text-white bg-gray-800 rounded"
    >
      {{ bulkEditMode ? "Exit Bulk Edit" : "Bulk Edit" }}
    </button> -->
    <!-- <button
      *ngIf="bulkEditMode"
      (click)="saveBulkChanges()"
      class="px-4 py-2 text-white bg-green-500 rounded"
    >
      Save All
    </button> -->
  </div>
</div>
