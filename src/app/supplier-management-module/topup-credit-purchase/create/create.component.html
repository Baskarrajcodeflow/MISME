<div class="container" *ngIf="rolePrivilege?.createPrivelege">
  <div class="flex justify-center">
    <div class="w-full max-w-7xl">
      <div class="bg-white shadow-md rounded-lg p-6">
        <h4 class="text-lg font-semibold mb-4">TopUp Credit Purchase</h4>
        <form [formGroup]="topupForm" class="space-y-6" (ngSubmit)="onSubmit()">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="form-group">
              <label for="supplier" class="block text-gray-700 font-medium mb-2">Supplier Name</label>
              <select required class="block w-full border border-gray-300 rounded-lg px-4 py-2"
                formControlName="supplier" (change)="onChangeSupplier($event)">
                <option value="" disabled>Select a supplier</option>
                <option *ngFor="let c of suppliers" [value]="c?.id">{{c?.supplierName}}</option>
              </select>
              <div *ngIf="supplier.invalid && (supplier.dirty || supplier.touched)" class="text-red-500 text-sm mt-1">
                <div *ngIf="supplier.errors?.['required']">
                  Please select a supplier.
                </div>
              </div>
            </div>

            <div class="form-group">
              <label for="commission" class="block text-gray-700 font-medium mb-2">Commission</label>
              <input type="text" class="block w-full border border-gray-300 rounded-lg px-4 py-2" value="{{commission}}"
                readonly>
            </div>

            <div class="form-group">
              <label for="inputFirstName" class="block text-sm font-medium text-gray-700">Mode Of Payment</label>
              <select required  (change)="onChangeTransfer($event)"
                class="block w-full px-3 py-2 mt-1 border border-gray-300 bg-white rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                <option value="0">---Please select wallet---</option>
                <!-- <option value="WALLET">Wallet Transfer</option> -->
                <option value="BANK">Bank Transfer</option>
              </select>
            </div>

            <div class="form-group" *ngIf="enableWalletSelection">
              <label for="wallet" class="block text-gray-700 font-medium mb-2">Attach Supplier Wallet</label>
              <select required class="block w-full border border-gray-300 rounded-lg px-4 py-2"
                formControlName="wallet">
                <option value="" disabled>Select a wallet</option>
                <option *ngFor="let c of wallets" [value]="c?.walletNo">{{c?.walletNo}}</option>
              </select>
              <div *ngIf="wallet.invalid && (wallet.dirty || wallet.touched)" class="text-red-500 text-sm mt-1">
                <div *ngIf="wallet.errors?.['required']">
                  Please select a wallet.
                </div>
              </div>
            </div>

            <div class="form-group" *ngIf="enableDefaultWallet">
                <label for="inputFirstName" class="block text-gray-700 font-medium mb-2">Account No</label>
                <input type="text" id="inputLastName" placeholder="1245232" readonly
                       class="block w-full px-4 py-2 mt-1 border border-gray-300 rounded-md bg-gray-100 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
              </div>

            <!-- <div class="form-group">
              <label for="amount" class="block text-gray-700 font-medium mb-2">Amount</label>
              <input type="text" class="block w-full border border-gray-300 rounded-lg px-4 py-2"
                formControlName="amount" placeholder="Amount" (change)="onChangeAmount()">
              <div *ngIf="amount.invalid && (amount.dirty || amount.touched)" class="text-red-500 text-sm mt-1">
                <div *ngIf="amount.errors?.['required']">
                  Please enter amount.
                </div>
              </div>
            </div>

            <div class="form-group">
              <label for="totalAmount" class="block text-gray-700 font-medium mb-2">Total Amount</label>
              <input type="text" class="block w-full border border-gray-300 rounded-lg px-4 py-2"
                value="{{totalAmountLast}}" readonly>
            </div>
          </div> -->

          <div class="form-group">
            <label for="amount" class="block text-gray-700 font-medium mb-2">Amount</label>
            <input type="text" class="block w-full border border-gray-300 rounded-lg px-4 py-2" (change)="onChangeAmount()"
              formControlName="amount" placeholder="Amount">
            <div *ngIf="amount.invalid && (amount.dirty || amount.touched)" class="text-red-500 text-sm mt-1">
              <div *ngIf="amount.errors?.['required']">
                Please enter amount.
              </div>
            </div>
          </div>
          
          <div class="form-group">
            <label for="totalAmount" class="block text-gray-700 font-medium mb-2">Total Amount</label>
            <input type="text" class="block w-full border border-gray-300 rounded-lg px-4 py-2"
              [value]="totalAmountLast" readonly>
          </div>
        </div>


          <div class="flex justify-end">
            <button type="submit" 
              class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white focus:outline-none focus:ring-2 focus:ring-offset-2"
              style="background-color: #0a365a;">
              Submit
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
  <app-loader *ngIf="isLoading"></app-loader>
</div>
