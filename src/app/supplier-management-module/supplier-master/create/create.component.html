<div class="container">
    <div class="grid grid-cols-1 md:grid-cols-1 gap-4 mt-6">
        <div class="col-span-1">
            <div class="bg-white shadow-md rounded-lg p-6">
                <h3 class="page-title text-2xl font-bold mb-4">Supplier Info</h3>

                <!-- <h4 class="text-lg font-semibold">Supplier Info</h4> -->
                <form [formGroup]="addSupplierForm" class="space-y-4 mt-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="form-group">
                            <label for="inputFirstName" class="block text-gray-700">Supplier Name</label>
                            <input type="text" class="form-control border border-gray-300 rounded w-full py-2 px-3"
                                formControlName="supplierName" id="inputFirstName" placeholder="Supplier Name">
                                <div *ngIf="supplierName.invalid && (supplierName.dirty || supplierName.touched)" class="text-red-500 text-sm mt-1">
                                    <div *ngIf="supplierName.errors?.['required']">
                                        Name is required.
                                    </div>
                                </div>
                        </div>
                        <div class="form-group">
                            <label for="inputLastName" class="block text-gray-700">Description</label>
                            <input type="text" class="form-control border border-gray-300 rounded w-full py-2 px-3"
                                formControlName="description" id="inputLastName" placeholder="Description">
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="form-group">
                            <label for="inputFirstName" class="block text-gray-700">Attach Supplier wallet</label>
                            <select required class="form-control border border-gray-300 rounded w-full py-2 px-3"
                                formControlName="walletNo">
                                <option *ngFor="let c of wallets" [value]="c?.walletNo">{{c?.walletNo}}/{{c?.accountDescription}}</option>
                            </select>
                            <div *ngIf="walletNo.invalid && (walletNo.dirty || walletNo.touched)" class="text-red-500 text-sm mt-1">
                                <div *ngIf="walletNo.errors?.['required']">
                                    Please select a wallet.
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="inputFirstName" class="block text-gray-700">Commission</label>
                            <input type="text" class="form-control border border-gray-300 rounded w-full py-2 px-3"
                                formControlName="commission" id="inputFirstName" placeholder="Commission Percentage">
                                <div *ngIf="commission.invalid && (commission.dirty || commission.touched)" class="text-red-500 text-sm mt-1">
                                    <div *ngIf="commission.errors?.['required']">
                                        commission is required..
                                    </div>
                                </div>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="form-group">
                            <label for="inputPhone" class="block text-gray-700">Phone Number</label>
                            <div class="input-group flex items-center">
                                <span
                                    class="input-group-text bg-gray-100 px-3 py-2 rounded-l border border-r-0 border-gray-300">+93</span>
                                <input type="text"
                                    class="form-control border border-gray-300 rounded-r w-full py-2 px-3"
                                    formControlName="phone" id="inputPhone" placeholder="Phone Number">
                            </div>
                            <div *ngIf="phone.invalid && (phone.dirty || phone.touched)"
                                class="text-red-500 text-sm mt-1">
                                <div *ngIf="phone.errors?.['required']">
                                    Phone Number is required.
                                </div>
                                <div *ngIf="phone.errors?.['pattern']">
                                    Phone Number must be at least 9 digits.
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="inputFirstName" class="block text-gray-700">Email</label>
                            <input type="text" class="form-control border border-gray-300 rounded w-full py-2 px-3"
                                formControlName="email" id="inputFirstName" placeholder="Email">
                                <div *ngIf="email.errors?.['email']"  class="text-red-500 text-sm mt-1">
                                   Please enter a valid email
                                </div>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="form-group">
                            <label for="inputLastName" class="block text-gray-700">Inventory Account</label>
                            <select required class="form-control border border-gray-300 rounded w-full py-2 px-3"
                                formControlName="inventoryAccountNo">
                                <option>----Please select inventory account----</option>
                                <option *ngFor="let c of inventoryAcc" [value]="c?.accountNo">{{c?.accountNo}}
                                </option>
                            </select>
                        </div>
                    </div>
                    <div class="flex justify-end">
                        <button type="submit" (click)="onSubmit()"
                            class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white focus:outline-none focus:ring-2 focus:ring-offset-2"
                            style="background-color: #0a365a;">{{ supplierId ? 'Update Supplier' : 'Create Supplier'
                            }}</button>
                    </div>
                </form>
            </div>
        </div>
        <app-loader *ngIf="isLoading"></app-loader>
    </div>
</div>
