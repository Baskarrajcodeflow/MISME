<div class="container">
    <div class="flex justify-end mb-4" *ngIf="rolePrivilege?.createPrivelege">
        <div>
            <button (click)="onClickCreate()" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white focus:outline-none focus:ring-2 focus:ring-offset-2"  style="background-color: #0a365a;">Create Supplier</button>
        </div>
    </div>
    <div class="w-full overflow-x-auto" *ngIf="rolePrivilege?.readPrivelege">
        <div class="bg-white shadow-md rounded-lg">
            <div class="p-4">
                <div class="table-responsive">
                    <table class="w-full border-collapse">
                        <thead>
                            <tr class="bg-gray-100">
                                <th class="text-center py-3 text-gray-700 font-semibold">Supplier Name1</th>
                                <th class="text-center py-3 text-gray-700 font-semibold">Email</th>
                                <th class="text-center py-3 text-gray-700 font-semibold">Phone</th>
                                <th class="text-center py-3 text-gray-700 font-semibold">Wallet No</th>
                                <th class="text-center py-3 text-gray-700 font-semibold">Commission</th>
                                <th class="text-center py-3 text-gray-700 font-semibold">Description</th>
                                <th class="py-3 text-gray-700 font-semibold">Action</th>
                            </tr>
                        </thead>
                        <tbody class="bg-white divide-y divide-gray-200 overflow-x-auto">
                            <tr *ngFor="let c of suppliers" class="border-t">
                                <td class="text-center py-3">{{c?.supplierName}}</td>
                                <td class="text-center py-3">{{c?.email}}</td>
                                <td class="text-center py-3">{{c?.phone}}</td>
                                <td class="text-center py-3">{{c?.walletNo}}</td>
                                <td class="text-center py-3">{{c?.commission}}</td>
                                <td class="text-center py-3">{{c?.description}}</td>
                                <td class="text-center py-3" *ngIf="rolePrivilege?.updatePrivelege"> 
                                    <button (click)="onClickEdit(c.id)" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white focus:outline-none focus:ring-2 focus:ring-offset-2"  style="background-color: #0a365a;">Edit</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>  
    <app-loader *ngIf="isLoading"></app-loader>  
</div>
