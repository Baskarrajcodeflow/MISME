<div class="relative min-h-screen bg-[#FAF9F6] font-sans overflow-hidden p-4 sm:p-8">
  
  <!-- Ambient Background (Warm Tones) -->
  <div class="absolute inset-0 pointer-events-none z-0">
    <div class="absolute top-0 right-1/4 w-[600px] h-[600px] bg-amber-500/10 rounded-full mix-blend-multiply blur-[120px]"></div>
    <div class="absolute bottom-0 left-1/4 w-[600px] h-[600px] bg-[#3B1E0B]/5 rounded-full mix-blend-multiply blur-[120px]"></div>
    <div class="absolute inset-0 bg-[radial-gradient(#78350f_1px,transparent_1px)] [background-size:32px_32px] opacity-[0.03]"></div>
  </div>

  <div class="relative z-10 max-w-5xl mx-auto">
    
    <!-- Page Header with Button on Top -->
    <div class="mb-8 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
      <div>
        <h1 class="text-3xl font-bold text-[#3B1E0B] tracking-tight">Roles</h1>
        <p class="mt-1 text-sm text-slate-500 font-medium">Manage system roles and access levels.</p>
      </div>
      
      <!-- Create Role Button -->
      <button 
        *ngIf="isEnableTable && rolePrivilege?.createPrivelege"
        type="button"
        (click)="onAddRole()"
        class="inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-xl bg-[#F59E0B] text-white font-semibold text-sm shadow-[0_4px_14px_rgba(245,158,11,0.3)] transition-all duration-300 hover:bg-[#D97706] hover:shadow-[0_6px_20px_rgba(245,158,11,0.4)] hover:-translate-y-0.5 active:scale-[0.98] w-full sm:w-auto mt-2 sm:mt-0">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
        Create Role
      </button>
    </div>

    <!-- Table View -->
    <div *ngIf="isEnableTable && rolePrivilege?.readPrivelege" class="bg-white rounded-3xl shadow-[0_8px_30px_-12px_rgba(0,0,0,0.05)] border border-amber-100 overflow-hidden">
      
      <div class="overflow-x-auto">
        <table class="w-full whitespace-nowrap">
          
          <!-- Table Header -->
          <thead>
            <tr class="bg-[#FAF9F6] border-b border-amber-100/60">
              <th scope="col" class="px-6 py-4 text-left text-[11px] font-bold text-[#3B1E0B]/70 uppercase tracking-wider">Role Name</th>
              <th scope="col" class="px-6 py-4 text-left text-[11px] font-bold text-[#3B1E0B]/70 uppercase tracking-wider">Description</th>
              <th scope="col" class="px-6 py-4 text-center text-[11px] font-bold text-[#3B1E0B]/70 uppercase tracking-wider">Action</th>
            </tr>
          </thead>

          <!-- Table Body -->
          <tbody class="divide-y divide-amber-100/40">
            <tr *ngFor="let role of roles" class="hover:bg-amber-50/30 transition-colors duration-200 group">
              
              <!-- Role Name -->
              <td class="px-6 py-4">
                <div class="flex items-center gap-3">
                  <div class="w-8 h-8 rounded-full bg-gradient-to-br from-amber-400 to-amber-600 text-white flex items-center justify-center font-bold text-xs shadow-sm ring-2 ring-white">
                    {{ role.roleName?.charAt(0)?.toUpperCase() || 'R' }}
                  </div>
                  <span class="text-sm font-semibold text-[#3B1E0B] group-hover:text-amber-700 transition-colors">
                    {{ role?.roleName }}
                  </span>
                </div>
              </td>

              <!-- Description -->
              <td class="px-6 py-4 text-sm text-slate-600">
                {{ role?.roleDesc || '—' }}
              </td>

              <!-- Action -->
              <td class="px-6 py-4 text-center">
                <button 
                  type="button" 
                  *ngIf="rolePrivilege?.updatePrivelege"
                  (click)="onClickEdit(role.id)"
                  class="inline-flex items-center justify-center px-3 py-1.5 bg-white border border-slate-200 rounded-lg text-xs font-semibold text-slate-600 shadow-sm transition-all duration-200 hover:bg-amber-50 hover:text-amber-600 hover:border-amber-200 hover:-translate-y-0.5 active:scale-[0.98]">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg>
                  Edit
                </button>
              </td>

            </tr>

            <!-- Empty State -->
            <tr *ngIf="roles.length === 0">
              <td colspan="3" class="px-6 py-12 text-center">
                <div class="flex flex-col items-center justify-center">
                  <div class="w-12 h-12 rounded-full bg-amber-50 flex items-center justify-center mb-3">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-amber-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>
                  </div>
                  <p class="text-slate-500 font-medium">No roles found.</p>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Create Role Form (if active) -->
    <div *ngIf="!isEnableTable" class="mt-6">
      <app-create-role (roleCreated)="onRoleCreated($event)"></app-create-role>
    </div>

    <!-- Loading State -->
    <div *ngIf="isLoading" class="flex justify-center py-12">
      <app-loader></app-loader>
    </div>

  </div>
</div>
