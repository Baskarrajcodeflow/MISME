<div class="relative min-h-screen bg-[#FAF9F6] font-sans overflow-hidden p-4 sm:p-8">
  
  <!-- Ambient Background (Warm Tones) -->
  <div class="absolute inset-0 pointer-events-none z-0">
    <div class="absolute top-0 right-1/4 w-[600px] h-[600px] bg-amber-500/10 rounded-full mix-blend-multiply filter blur-[120px]"></div>
    <div class="absolute bottom-0 left-1/4 w-[600px] h-[600px] bg-[#3B1E0B]/5 rounded-full mix-blend-multiply filter blur-[120px]"></div>
    <div class="absolute inset-0 bg-[radial-gradient(#78350f_1px,transparent_1px)] [background-size:32px_32px] opacity-[0.03]"></div>
  </div>

  <div class="relative z-10 max-w-4xl mx-auto">
    
    <!-- Page Header with Button on Top -->
    <div class="mb-8 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
      <div>
        <h1 class="text-3xl font-bold text-[#3B1E0B] tracking-tight">Branches</h1>
        <p class="mt-1 text-sm text-slate-500 font-medium">Manage physical branch locations for your organization.</p>
      </div>
      
      <!-- Create Branch Button -->
      <button 
        *ngIf="isEnableTable && rolePrivilege?.createPrivelege"
        type="button"
        (click)="addBranch()"
        class="inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-xl bg-[#F59E0B] text-white font-semibold text-sm shadow-[0_4px_14px_rgba(245,158,11,0.3)] transition-all duration-300 hover:bg-[#D97706] hover:shadow-[0_6px_20px_rgba(245,158,11,0.4)] hover:-translate-y-0.5 active:scale-[0.98] w-full sm:w-auto mt-2 sm:mt-0">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
        Create Branch
      </button>
    </div>

    <!-- Table View -->
    <div *ngIf="isEnableTable && rolePrivilege?.readPrivelege" class="bg-white rounded-3xl shadow-[0_8px_30px_-12px_rgba(0,0,0,0.05)] border border-amber-100 overflow-hidden">
      
      <div class="overflow-x-auto">
        <table class="w-full whitespace-nowrap">
          
          <!-- Table Header -->
          <thead>
            <tr class="bg-[#FAF9F6] border-b border-amber-100/60">
              <th scope="col" class="px-6 py-4 text-left text-[11px] font-bold text-[#3B1E0B]/70 uppercase tracking-wider">
                Branch Name
              </th>
            </tr>
          </thead>

          <!-- Table Body -->
          <tbody class="divide-y divide-amber-100/40">
            <tr *ngFor="let branch of branches" class="hover:bg-amber-50/30 transition-colors duration-200 group">
              <td class="px-6 py-4">
                <div class="flex items-center gap-3">
                  <div class="w-8 h-8 rounded-lg bg-amber-50 border border-amber-100 flex items-center justify-center text-amber-600">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                  </div>
                  <span class="text-sm font-semibold text-[#3B1E0B] group-hover:text-amber-700 transition-colors">
                    {{ branch.name }}
                  </span>
                </div>
              </td>
            </tr>

            <!-- Empty State -->
            <tr *ngIf="branches.length === 0">
              <td class="px-6 py-12 text-center">
                <div class="flex flex-col items-center justify-center">
                  <div class="w-12 h-12 rounded-full bg-amber-50 flex items-center justify-center mb-3">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-amber-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" /></svg>
                  </div>
                  <p class="text-slate-500 font-medium">No branches found.</p>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Create Branch Form (if active) -->
    <div *ngIf="!isEnableTable" class="mt-6">
      <app-branch (branchCreated)="branchCreated($event)"></app-branch>
    </div>

  </div>
</div>
