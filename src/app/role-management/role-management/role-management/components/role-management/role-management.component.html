<div class="role-management">
    <h1 class="text-2xl font-bold mb-4">Role Management</h1>
    
    <div class="role-list mb-8">
      <h2 class="text-xl font-semibold mb-2">Existing Roles</h2>
      <ul class="list-disc pl-5">
        <li *ngFor="let role of roles" (click)="onSelectRole(role)" class="cursor-pointer hover:text-blue-500">
          {{ role.roleName }}
        </li>
      </ul>
    </div>
  
    <div class="role-form">
      <h2 *ngIf="!selectedRole" class="text-xl font-semibold mb-2">Create New Role</h2>
      <h2 *ngIf="selectedRole" class="text-xl font-semibold mb-2">Edit Role: {{ selectedRole.roleName }}</h2>
  
      <div *ngIf="!selectedRole" class="mb-4">
        <label for="newRoleName" class="block mb-1">Role Name:</label>
        <input id="newRoleName" [(ngModel)]="newRoleName" placeholder="Enter new role name" class="border rounded p-2 w-full" />
      </div>
  
      <app-module-list
        [permissions]="permissions"
        [selectedRole]="selectedRole"
        (togglePermission)="togglePermission($event)"
      ></app-module-list>
  
      <button (click)="onSaveRole()" class="bg-blue-500 text-white px-4 py-2 rounded mt-4">Save Role</button>
    </div>
  </div>
