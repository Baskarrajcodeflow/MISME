<div *ngFor="let moduleName of getModuleNames()">
  <div class="border rounded mb-2">
    <div class="bg-gray-200 px-4 py-2 cursor-pointer" (click)="toggleModuleAccordion(moduleName)">
      <h3 class="text-lg font-medium">{{ moduleName }}</h3>
    </div>
    <div *ngIf="isModuleAccordionOpen(moduleName)" class="bg-white px-4 py-2">
      <app-feature-list
        [permissions]="getFilteredPermissions(moduleName)"
        [selectedRole]="selectedRole"
        (togglePermission)="onTogglePermission($event)"
      ></app-feature-list>
    </div>
  </div>
</div>
