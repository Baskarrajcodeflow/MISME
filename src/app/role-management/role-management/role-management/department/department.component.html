<div class="relative bg-white rounded-3xl shadow-[0_8px_30px_-12px_rgba(0,0,0,0.05)] border border-amber-100 overflow-hidden max-w-2xl mx-auto">
  
  <!-- Top Accent Line -->
  <div class="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-amber-400 via-amber-500 to-amber-600"></div>

  <div class="p-8">
    
    <!-- Header -->
    <div class="mb-8">
      <h2 class="text-2xl font-bold text-[#3B1E0B] tracking-tight">Add Department</h2>
      <p class="mt-1 text-sm text-slate-500 font-medium">Create a new organizational department within a branch.</p>
    </div>

    <!-- Form -->
    <form (ngSubmit)="onSubmit()" class="space-y-6">
      
      <!-- Branch Selector -->
      <div class="flex flex-col space-y-1.5">
        <label for="branch" class="text-[13px] font-semibold text-[#3B1E0B] tracking-wide ml-0.5">
          Parent Branch <span class="text-rose-500">*</span>
        </label>
        <div class="relative">
          <select 
            id="branch" 
            name="branch" 
            [(ngModel)]="selectedBranch"
            required
            class="w-full appearance-none px-4 py-2.5 bg-[#EEF2FF] border border-transparent rounded-lg text-[#3B1E0B] text-sm focus:outline-none focus:bg-white focus:ring-4 focus:ring-amber-500/20 focus:border-amber-500 hover:bg-indigo-100/70 cursor-pointer transition-all"
          >
            <option value="">Select a branch</option>
            <option *ngFor="let branch of branches" [value]="branch?.id">{{ branch?.name }}</option>
          </select>
          <svg class="pointer-events-none absolute right-3.5 top-3.5 h-4 w-4 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
        </div>
      </div>

      <!-- Department Name Input -->
      <div class="flex flex-col space-y-1.5">
        <label for="departmentName" class="text-[13px] font-semibold text-[#3B1E0B] tracking-wide ml-0.5">
          Department Name <span class="text-rose-500">*</span>
        </label>
        <input 
          type="text" 
          id="departmentName" 
          name="departmentName" 
          [(ngModel)]="departmentName"
          placeholder="e.g. Risk & Compliance"
          required
          class="w-full px-4 py-3 bg-[#EEF2FF] border border-transparent rounded-lg text-[#3B1E0B] placeholder-slate-400 text-sm transition-all duration-300 focus:outline-none focus:bg-white focus:ring-4 focus:ring-amber-500/20 focus:border-amber-500 hover:bg-indigo-100/70"
        />
      </div>

      <!-- Actions -->
      <div class="flex items-center justify-end pt-4 border-t border-slate-100">
        <button 
          type="submit" 
          [disabled]="!selectedBranch || !departmentName"
          class="inline-flex items-center justify-center gap-2 px-8 py-2.5 rounded-xl bg-[#F59E0B] text-white font-bold text-sm shadow-[0_4px_14px_rgba(245,158,11,0.3)] transition-all duration-300 hover:bg-[#D97706] hover:shadow-[0_6px_20px_rgba(245,158,11,0.4)] hover:-translate-y-0.5 active:scale-[0.98] disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:translate-y-0 disabled:hover:shadow-none"
        >
          Submit
        </button>
      </div>
    </form>

  </div>
</div>

<!-- Loading State -->
<div *ngIf="isLoading" class="mt-6 flex justify-center">
  <app-loader></app-loader>
</div>
