<div class="container mx-auto p-4 m-h-[100px] table-container">
  <form [formGroup]="form">
    <div>
      <div class="flex gap-4">
        <div class="w-1/2">
          <div class="mb-4">
            <label
              for="service"
              class="block text-gray-700"
              style="font-size: 14px"
            >
              GL Code / GL Account Number</label
            >
            <input
              formControlName="glAccNumber"
              for
              type="text"
              id="name"
              class="mt-1 p-1 border rounded w-full focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>
          <div class="mb-4">
            <label class="block text-gray-700" style="font-size: 14px"
              >Type</label
            >
            <select
              formControlName="type"
              class="mt-1 p-1 border rounded w-full focus:outline-none focus:ring-2 focus:ring-blue-500"
            >
              <option>----</option>
              <option>Assest</option>
              <option>Liability</option>
              <option>Income</option>
              <option>Expense</option>
            </select>
          </div>
          <div
            class="mb-4"
            *ngIf="
              this.form.controls['category'].value == 'Leaf' ||
              this.form.controls['category'].value == 'Sub Head'
            "
          >
            <label class="block text-gray-700" style="font-size: 14px"
              >Parent Head</label
            >
            <select
              formControlName="parentHead"
              class="mt-1 p-1 border rounded w-full focus:outline-none focus:ring-2 focus:ring-blue-500"
            >
              <option>----</option>
              <option>Assest</option>
              <option>Liability</option>
              <option>Income</option>
              <option>Expense</option>
            </select>
          </div>
        </div>
        <div class="w-1/2">
          <div class="mb-4">
            <label class="block text-gray-700" style="font-size: 14px"
              >Description</label
            >
            <input
              formControlName="description"
              type="text"
              id="name"
              class="mt-1 p-1 border rounded w-full focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>
          <div class="mb-4">
            <label class="block text-gray-700" style="font-size: 14px"
              >Category</label
            >
            <select
              formControlName="category"
              class="mt-1 p-1 border rounded w-full focus:outline-none focus:ring-2 focus:ring-blue-500"
            >
              <option>----</option>
              <option>Head</option>
              <option>Sub Head</option>
              <option>Leaf</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <div class="float-left">
      <button
        type="submit"
        class="bg-blue-500 text-white py-1 px-3 rounded hover:bg-blue-700"
      >
        Submit
      </button>
    </div>
  </form>
</div>
