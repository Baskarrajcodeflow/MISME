<div *ngIf="isLoading" class="fixed inset-0 flex items-center justify-center z-50 bg-opacity-50 bg-gray-800">
    <div class="w-16 h-16 border-4 border-solid border-gray-300 rounded-full animate-spin border-t-transparent"></div>
</div>
<div class="container">
    <div class="page-header">
    </div>
    <div class="row">
        <div class="col-md-12 grid-margin stretch-card">
            <div class="card shadow-lg rounded-lg p-6 bg-white">
                <div class="card-body">
                    <h3 class="page-title text-2xl font-bold mb-4">Add Risk Parameter</h3>
                    <form [formGroup]="createForm" (ngSubmit)="AddRiskParamABMMC()">
                        <div class="flex flex-wrap -mx-2">
                            <div class="w-full sm:w-1/2 px-2 mb-4">
                                <label for="riskType" class="block text-gray-700 font-bold mb-2">Risk Parameter
                                    Type</label>
                                <select formControlName="riskType" id="riskType"
                                    class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                                    (change)="onSelectRiskType($event)">
                                    <option value="">Select a Type</option>
                                    <option value="PURPOSE_OF_ACC">Purpose Of Account</option>
                                    <option value="GEO_LOCATION">Province</option>
                                    <option value="ACCOUNT_TYPE">Account Type</option>
                                    <option value="SOURCE_OF_INCOME">Source Of Income</option>
                                    <option value="MODE_OF_TXN">Mode Of transaction</option>
                                </select>
                                <div *ngIf="createForm.get('riskType')?.touched && createForm.get('riskType')?.invalid"
                                    class="text-red-600 text-sm">
                                    Risk Type is required.
                                </div>
                            </div>
                            <!-- new -->
                            <div class="w-full sm:w-1/2 px-2 mb-4" *ngIf="showProvince">
                                <label for="province" class="block text-gray-700 font-bold mb-2">Risk Value
                                    <sup style="color: red;">*</sup>
                                </label>
                                <select id="province" formControlName="riskValue"
                                    class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                                    (change)="onSelectProvince($event)">
                                    <option *ngFor="let province of provinces" [value]="province.name">{{province.name}}
                                    </option>
                                </select>
                            </div>
                            <!-- new -->

                            <div class="w-full sm:w-1/2 px-2 mb-4" *ngIf="showRiskCommon">
                                <label for="riskValue" class="block text-gray-700 font-bold mb-2">Risk Value</label>
                                <input id="riskValue" type="text" formControlName="riskValue" [disabled]="true"
                                    class="w-full px-3 py-2 border rounded">
                                <div *ngIf="createForm.get('riskValue')?.touched && createForm.get('riskValue')?.invalid"
                                    class="text-red-600 text-sm">
                                    Risk Value is required.
                                </div>
                            </div>
                            <div class="w-full sm:w-1/2 px-2 mb-4">
                                <label for="Score" class="block text-gray-700 font-bold mb-2">Score</label>
                                <input id="Score" type="number" formControlName="Score"
                                    class="w-full px-3 py-2 border rounded">
                                <div *ngIf="createForm.get('Score')?.touched && createForm.get('Score')?.invalid"
                                    class="text-red-600 text-sm">
                                    <div *ngIf="createForm.get('Score')?.errors?.['required']">Score is required.</div>
                                    <div *ngIf="createForm.get('Score')?.errors?.['max']">Score cannot exceed 100.</div>
                                </div>
                            </div>
                            <div class="w-full sm:w-1/2 px-2 mb-4">
                                <label for="userType" class="block text-gray-700 font-bold mb-2">User Type</label>
                                <select formControlName="userType" id="userType"
                                    class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                                    (change)="onSelectUserType($event)">
                                    <option value="">Select a Type</option>
                                    <option value="CUSTOMER">CUSTOMER</option>
                                    <option value="AGENT">AGENT</option>
                                    <option value="MERCHANT">MERCHANT</option>
                                    <option value="CORPORATE">CORPORATE</option>
                                    <option value="BO">BO</option>
                                </select>
                                <div *ngIf="createForm.get('userType')?.touched && createForm.get('userType')?.invalid"
                                    class="text-red-600 text-sm">
                                    User Type is required.
                                </div>
                            </div>
                            <div class="w-full sm:w-1/2 px-2 mb-4">
                                <label for="desc" class="block text-gray-700 font-bold mb-2">Description</label>
                                <input id="desc" type="desc" formControlName="desc"
                                    class="w-full px-3 py-2 border rounded">
                            </div>

                            <div class="w-full px-2 mb-4">
                                <button type="submit" [disabled]="!createForm.valid"
                                    style="background-color: #0a365a;float: right;"
                                    class="mt-4 px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">
                                    Add
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
