<div *ngIf="isLoading" class="fixed inset-0 flex items-center justify-center z-50 bg-opacity-50 bg-gray-800">
    <div class="w-16 h-16 border-4 border-solid border-gray-300 rounded-full animate-spin border-t-transparent"></div>
</div>
<div class="container">
    <div class="page-header">
    </div>
    <div class="row">
        <div class="col-md-12 grid-margin stretch-card">
            <div class="card shadow-lg rounded-lg p-6 bg-white">
                <div class="card-body">
                    <h3 class="page-title text-2xl font-bold mb-4">Add Risk Tier</h3>
                    <form [formGroup]="createForm" (ngSubmit)="AddRiskTierABMMC()">
                        <div class="flex flex-wrap -mx-2">
                            <div class="w-full sm:w-1/2 px-2 mb-4">
                                <label for="riskType" class="block text-gray-700 font-bold mb-2">Risk Tier
                                </label>
                                <select formControlName="riskTier" id="riskTier"
                                    class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                                    (change)="onSelectRiskTier($event)">
                                    <option value="">Select a Type</option>
                                    <option value="LOW">LOW</option>
                                    <option value="MEDIUM">MEDIUM</option>
                                    <option value="HIGH">HIGH</option>
                                </select>
                                <div *ngIf="createForm.get('riskTier')?.touched && createForm.get('riskTier')?.invalid"
                                    class="text-red-600 text-sm">
                                    Risk Tier is required.
                                </div>
                            </div>

                            <div class="w-full sm:w-1/2 px-2 mb-4">
                                <label for="fromScore" class="block text-gray-700 font-bold mb-2">From Score</label>
                                <input id="fromScore" type="number" formControlName="fromScore"
                                    class="w-full px-3 py-2 border rounded">
                                <div *ngIf="createForm.get('fromScore')?.touched && createForm.get('fromScore')?.invalid"
                                    class="text-red-600 text-sm">
                                    <div *ngIf="createForm.get('fromScore')?.errors?.['required']">Score is required.</div>
                                    <div *ngIf="createForm.get('fromScore')?.errors?.['max']">Score cannot exceed 100.</div>
                                </div>
                            </div>
                            <div class="w-full sm:w-1/2 px-2 mb-4">
                                <label for="toScore" class="block text-gray-700 font-bold mb-2">To Score</label>
                                <input id="toScore" type="number" formControlName="toScore"
                                    class="w-full px-3 py-2 border rounded">
                                <div *ngIf="createForm.get('toScore')?.touched && createForm.get('toScore')?.invalid"
                                    class="text-red-600 text-sm">
                                    <div *ngIf="createForm.get('toScore')?.errors?.['required']">Score is required.</div>
                                    <div *ngIf="createForm.get('toScore')?.errors?.['max']">Score cannot exceed 100.</div>
                                </div>
                            </div>

                            <div class="w-full px-2 mb-4">
                                <button type="submit" style="background-color: #0a365a;float: right;"
                                    [disabled]="!createForm.valid"
                                    class="mt-4 px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">
                                    Add
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
