<div class="row">
    <div class="col-6">
        &nbsp;
    </div>
    <div class="col-6">
        <div class="text-right" style="margin-right: 50px !important">
            <button (click)="onClickCreate()" class="btn btn-success">Create LCTR Parameter</button>
        </div>
    </div>
</div>
<br>
<div class="page-header">
    <h1 class="page-title">
        List LCTR Parameter
    </h1>
</div>
<div class="row">
    <div class="col-lg-12 grid-margin stretch-card">
        <div class="card">
            <!-- <div>
                <mat-paginator [pageSize]="15" showFirstLastButtons aria-label="Select page of periodic elements">
                </mat-paginator>
            </div> -->
            <div class="card-body">
                <h4 class="card-title">LCTR Parameter</h4>
                <p class="card-description">
                    List
                </p>
                <br>
                <div class="table-responsive table">
                    <table class="table">
                        <thead>
                            <tr>
                                <th style="text-align: center;">User Type</th>
                                <th style="text-align: center;">Date</th>
                                <th style="text-align: center;">Amount</th>

                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let c of content">
                                <td style="text-align: center;"> {{c?.userType}}</td>
                                <td style="text-align: center;">{{c?.createdOn| date:'yyyy-MM-dd HH:mm'}}</td>
                                <td style="text-align: center;">{{c?.amount | number}}</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>
    </div>
</div>
