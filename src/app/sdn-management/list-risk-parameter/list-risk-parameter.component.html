<div *ngIf="isLoading" class="fixed inset-0 flex items-center justify-center z-50 bg-opacity-50 bg-gray-800">
    <div class="w-16 h-16 border-4 border-solid border-gray-300 rounded-full animate-spin border-t-transparent"></div>
</div>
<div class="container mx-auto p-4">
    <div class="w-full px-2 mb-4">
        <button type="submit" (click)="onClickAdd()" style="background-color: #0a365a;float: right;"
            class="mt-4 px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">
            Add
        </button>
    </div>
    <table class="min-w-full table-auto">
        <thead class="bg-gray-200">
            <tr>
                <th class="px-4 py-2">Risk Type</th>
                <th class="px-4 py-2">Risk Value</th>
                <th class="px-4 py-2">Score</th>
                <th class="px-4 py-2">User Type</th>
                <th class="px-4 py-2">Created</th>
                <th class="px-4 py-2">Actions</th>
        </thead>
        <tbody>
            <ng-container *ngFor="let item of data">
                <tr *ngIf="item.score !== 0">
                  <td class="border px-4 py-2">{{ item.riskParamType }}</td>
                  <td class="border px-4 py-2">{{ item.riskValue }}</td>
                  <td class="border px-4 py-2">{{ item.score }}</td>
                  <td class="border px-4 py-2">{{ item.userType }}</td>
                  <td class="border px-4 py-2">{{ item.createdOn }}</td>
                  <td class="border px-4 py-2 text-center">
                    <button (click)="onDelete(item)" class="text-red-500 hover:text-red-700">
                      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 6h18M9 6v12m6-12v12m-9 0h12V6H6zM6 6V4a1 1 0 011-1h10a1 1 0 011 1v2"/>
                      </svg>
                    </button>
                  </td>
                </tr>
              </ng-container>
              
        </tbody>
    </table>
</div>
