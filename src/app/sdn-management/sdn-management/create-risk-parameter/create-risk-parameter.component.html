<div class="page-header">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a class="Txtcolor" href="javascript:;">Risk Parameter</a></li>
            <li class="breadcrumb-item active" aria-current="page">Create Risk Parameter</li>
        </ol>
    </nav>
</div>
<div class="row">
    <div class="col-md-12 grid-margin stretch-card">
        <div class="card">
            <div class="card-body">
                <p class="card-description">

                </p>
                <form [formGroup]="addRiskParameterForm">
                    <div class="row">
                        <div class="col-12">
                            <div class="form-group">
                                <div class="form-group">
                                    <div class="form-group">
                                        <label>Customer Type</label>
                                        <select required formControlName="customer" class="form-control">
                                            <option value="CUSTOMER">Individual</option>
                                            <option value="CORPORATE_CUSTOMER">Corporate</option>
                                            <option value="AGENT">Agent</option>
                                        </select>
                                    </div>
                                </div>
                                <label>Risk Type <sup style="color: red;">*</sup></label>
                                <select required formControlName="riskType" class="form-control"
                                    (change)="onChangeRiskType()">
                                    <option value="PRODUCT">Product</option>
                                    <option value="PROVINCE">Province</option>
                                    <option value="OCCUPATION">Occupation</option>
                                    <option value="PEP">PEP</option>
                                    <option value="INCOME">Income</option>
                                    <!-- <option value="TXN_VOL_DAY">Transaction Volume</option> -->
                                </select>
                            </div>
                            <div *ngIf="showProduct" class="form-group">
                                <label>Risk Value </label>
                                <select required class="form-control" formControlName="product"
                                    (change)="onChangeProduct($event)">
                                    <option *ngFor="let c of productList" [value]="c?.id">{{c?.productName}}
                                    </option>
                                </select>
                            </div>
                            <div *ngIf="showProvince" class="form-group">
                                <label>Risk Value </label>
                                <select required class="form-control" formControlName="province"
                                    (change)="onChangeProvince($event)">
                                    <option *ngFor="let c of provinceList" [value]="c?.id">{{c?.province}}
                                    </option>
                                </select>
                            </div>
                            <div *ngIf="showOccupation" class="form-group">
                                <label>Risk Value </label>
                                <select required class="form-control" formControlName="occupation"
                                    (change)="onChangeOccupation($event)">
                                    <option *ngFor="let c of OccupationList" [value]="c?.id">{{c?.occupation}}
                                    </option>
                                </select>
                            </div>
                            <div *ngIf="showIncome" class="form-group">
                                <label>Risk Value </label>
                                <select required class="form-control" formControlName="income"
                                    (change)="onChangeIncome($event)">
                                    <option *ngFor="let c of incomeList" [value]="c?.id">{{c?.income}}
                                    </option>
                                </select>
                            </div>
                            <div *ngIf="showVolume" class="form-group">
                                <label>Risk Value </label>
                                <select required class="form-control" formControlName="volume"
                                    (change)="onChangeVolume($event)">
                                    <option *ngFor="let c of volumeList" [value]="c?.id">{{c?.volume}}
                                    </option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Risk Score</label>
                                <input type="text" formControlName="riskScore" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label>Description </label>
                                <input formControlName="description" type="text" class="form-control" placeholder="">
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col">
                            <button style="width: 100%;" (click)="onClickSubmit()" type="button"
                                class="btn btn-primary">Create</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
