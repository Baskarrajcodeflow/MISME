<div class="page-header">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a class="Txtcolor" href="javascript:;">Risk Tier</a></li>
            <li class="breadcrumb-item active" aria-current="page">Create Risk Tier</li>
        </ol>
    </nav>
</div>
<div class="row">
    <div class="col-md-12 grid-margin stretch-card">
        <div class="card">
            <div class="card-body">
                <form [formGroup]="addRiskTierForm">
                    <div class="row">
                        <div class="col-12">
                            <div class="form-group">
                                <label>Tier</label>
                                <select required formControlName="tier" class="form-control">
                                    <option value="LOW">Low</option>
                                    <option value="MEDIUM">Medium</option>
                                    <option value="HIGH">High</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-12">
                            <div class="form-group">
                                <label>Score From</label>
                                <input type="text" formControlName="from" class="form-control" required>
                            </div>
                        </div>
                        <div class="col-12">
                            <div class="form-group">
                                <label>Score To</label>
                                <input type="text" formControlName="to" class="form-control" required>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-12">
                            <button style="width: 100%;" (click)="onClickSubmit()" type="button"
                                class="btn btn-primary">Create</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        <br>


    </div>
</div>
