<div class="tabs h-full">
  <ul class="tab-list">
    <li *ngFor="let tab of tabs"
        (click)="selectTab(tab)"
        [class.active]="tab === selectedTab"
        class="tab-item">
      {{ tab.title }}
    </li>
  </ul>
  <div class="tab-content" *ngIf="selectedTab">
    <ng-container *ngTemplateOutlet="selectedTab.content"></ng-container>
  </div>
</div>
