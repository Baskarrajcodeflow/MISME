<!-- Outer container: brand gradient from --brand-gradient (defaults in styles.css, platform overrides in src/themes/) -->
<div class="relative h-16 sticky top-0 z-50 bg-[image:var(--brand-gradient)] shadow-md">
  
  <!-- Header container -->
  <header [class]="auth.currentUser() ? 'text-white absolute inset-x-0 top-0 h-16 flex items-center' : ''">
    
    <nav [hidden]="auth.currentUser() == ''" class="w-full px-6 flex items-center justify-between">
      
      <!-- Left side: Logo -->
      <div class="flex items-center">
        <!-- Menu button (below lg = 1024px only): opens the sidebar drawer. From lg up the sidebar is always visible (same breakpoint as sidebar.component.css). -->
        <button
          type="button"
          (click)="sidebar.toggleMobile()"
          aria-label="Open menu"
          [attr.aria-expanded]="sidebar.mobileOpen()"
          class="-ml-2 mr-3 inline-flex h-10 w-10 items-center justify-center rounded-lg text-white transition-colors hover:bg-white/10 focus-visible:outline focus-visible:outline-2 lg:hidden"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>

        <!-- Logo comes from PLATFORM_BRAND (src/environments/platform*.ts); nothing shows when the platform sets no logo. -->
        <!-- Slight white background and padding so the logo pops against the dark header -->
        @if (brand.logo) {
          <img [src]="brand.logo" [alt]="brand.appName" class="h-10 w-auto object-contain bg-white rounded px-2 py-1 shadow-sm" />
        }
      </div>

      <!-- Right side: User Menu -->
      <div class="flex items-center">
        <!-- Trigger Button: White icon, white/10 hover -->
        <button mat-icon-button [matMenuTriggerFor]="menu" class="text-white hover:bg-white/10 rounded-full transition-colors focus:outline-none">
          <mat-icon>arrow_drop_down</mat-icon>
        </button>

        <!-- Dropdown Menu -->
        <mat-menu #menu="matMenu" class="custom-menu mt-2 rounded-xl">
          
          <!-- User Info Wrapper -->
          <div class="p-4 flex items-center space-x-3 min-w-[220px] bg-white rounded-t-xl">
            <img src="../../../assets/images/user.png" alt="User Avatar" class="w-10 h-10 rounded-full border border-gray-200 object-cover" />
            
            <div class="flex flex-col">
              <div class="text-sm font-bold text-gray-900">{{ userName }}</div>
              <div class="text-xs text-gray-500 flex items-center mt-0.5">
                <span class="font-medium mr-1">Role:</span>
                <!-- Role text in the brand accent colour -->
                <span class="text-[color:var(--brand-accent)] font-bold">{{ roleName }}</span>
              </div>
            </div>
          </div>

          <mat-divider class="border-gray-100"></mat-divider>

          <div class="bg-white rounded-b-xl py-1">
            <!-- Logout Button -->
            <button mat-menu-item (click)="auth.logout()" class="hover:bg-gray-50 transition-colors">
              <mat-icon class="text-gray-500">power_settings_new</mat-icon>
              <span class="text-gray-700 font-medium">Logout</span>
            </button>

            <!-- Reset Password Button -->
            <button mat-menu-item (click)="resetPassword()" class="hover:bg-gray-50 transition-colors">
              <mat-icon class="text-gray-500">lock_reset</mat-icon>
              <span class="text-gray-700 font-medium">Reset Password</span>
            </button>
          </div>
        </mat-menu>
      </div>
      
    </nav>
  </header>
</div>
