<div class="reset-password-container">
    <h2>Reset Password</h2>

    <form [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()">
        <!-- Old Password -->
        <div class="form-group">
            <label for="oldPassword">Old Password</label>
            <input type="password" id="oldPassword" formControlName="oldPassword" placeholder="Old Password" required />
        </div>

        <!-- New Password -->
        <!-- <div class="form-group">
            <label for="newPassword">New Password</label>
            <input type="password" id="newPassword" formControlName="newPassword" placeholder="New Password" required />
        </div> -->
        <div class="form-group">
            <label for="newPassword">New Password</label>
            <input type="password" id="newPassword" formControlName="newPassword" placeholder="New Password" required
                class="form-control" />

            <!-- Error messages -->
            <div *ngIf="resetPasswordForm.get('newPassword')?.invalid && (resetPasswordForm.get('newPassword')?.dirty || resetPasswordForm.get('newPassword')?.touched)"
                class="text-red-500 text-sm mt-1">
                <div *ngIf="resetPasswordForm.get('newPassword')?.errors?.['required']">Password is required.</div>
                <div *ngIf="resetPasswordForm.get('newPassword')?.errors?.['pattern']">
                    Password must contain at least one uppercase letter and one digit (0-9), and be at least 8
                    characters long.
                </div>
                <!-- <div *ngIf="resetPasswordForm.get('newPassword')?.errors?.['maxlength']">
                    Password must not exceed 12 characters.
                </div> -->
            </div>
        </div>
        <!-- Confirm New Password -->
        <div class="form-group">
            <label for="confirmPassword">Confirm New Password</label>
            <input type="password" id="confirmPassword" formControlName="confirmPassword"
                placeholder="Confirm New Password" required />
            <div *ngIf="!passwordsMatch() && resetPasswordForm.get('confirmPassword')?.touched" class="error-message">
                Passwords do not match
            </div>
        </div>

        <!-- Buttons -->
        <div class="button-group">
            <button type="submit" class="update-button"
                [ngClass]="resetPasswordForm.valid ? 'update-button-valid' : 'update-button-invalid'"
                [disabled]="resetPasswordForm.invalid">
                Update Password
            </button>
            <button type="button" class="reset-button" (click)="onReset()" style="background-color: #0a365a;">
                Reset
            </button>
        </div>
    </form>
</div>
