<div class="p-4 max-w-sm mx-auto">
    <form [formGroup]="twoFactorForm" (ngSubmit)="verifyTwoFactorCode()" class="flex flex-col space-y-3">
      <div>
        <label for="twoFactorCode" class="block text-sm font-medium text-gray-700">Enter 2FA Code:</label>
        <input type="text" id="twoFactorCode" formControlName="twoFactorCode" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" placeholder="123456">
      </div>
      <button type="submit" class="mt-3 btn btn-blue" [disabled]="twoFactorForm.invalid">Verify</button>
    </form>
  </div>
