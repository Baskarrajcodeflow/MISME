<div class="fixed inset-0 flex items-center justify-center bg-gray-900 bg-opacity-50">
    <div class="bg-white p-6 rounded-lg shadow-lg max-w-sm w-full">
      <!-- <h2 class="text-xl font-semibold text-gray-800 mb-4">Session Expiring</h2> -->
      <p class="text-gray-600 mb-6">You have been inactive for a while. Do you want to log out?</p>
      <div class="flex justify-end space-x-4">
        <button (click)="loggedIn(true)" class="px-4 py-2 bg-gray-300 text-gray-800 rounded-lg hover:bg-gray-400">Stay Logged In</button>
        <button (click)="loggedIn(false)" class="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600">Log Out</button>
      </div>
    </div>
  </div>
