<div class="container mx-auto p-4 m-h-[100px] table-container">
    <form [formGroup]="form" >

      <div>
        <div
          class="flex gap-2 mt-4"
        >
          <div class="w-1/2">
            <div class="mb-4">
              <label
                for="service"
                class="block text-gray-700"
                style="font-size: 14px"
                >Service</label
              >
              <select 
              (ngModelChange)="serviceOnchage($event)"
                formControlName="service"
                class="mt-1 p-1 border rounded w-full focus:outline-none focus:ring-2 focus:ring-blue-500"
              >
                <option disabled>Select an option</option>
                <option *ngFor="let item of serviceArray" [value]="item">{{ item?.name }}</option>
              </select>
            </div>
            <div class="mb-4">
              <label for="amountLimit" class="block text-gray-700" style="font-size: 14px">Select Amount Limit</label>
              <select (ngModelChange)="dataChanged($event)" formControlName="amountLimit" class="mt-1 p-1 border rounded w-full focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option *ngFor="let item of amountLimit" [ngValue]="item">{{ item?.name }}</option>
              </select>
            </div>
            <div class="mb-4">
              <label
                for="transactionLimit"
                class="block text-gray-700"
                style="font-size: 14px"
                >Select Transaction Limit</label
              >
              <select (ngModelChange)="transactionLimitChanged($event)"
                formControlName="transactionLimit"
                class="mt-1 p-1 border rounded w-full focus:outline-none focus:ring-2 focus:ring-blue-500"
              >
                <option *ngFor="let item of taxAndCommissionArray" [ngValue]="item">{{ item?.name }}</option>
              </select>
            </div>
            <div class="mb-4">
              <label
                for="cashback"
                class="block text-gray-700"
                style="font-size: 14px"
                >Select Cashback & Commission</label
              >
              <select
              (ngModelChange)="cashbackChanged($event)"
                formControlName="cashback"
                class="mt-1 p-1 border rounded w-full focus:outline-none focus:ring-2 focus:ring-blue-500"
              >
                <option *ngFor="let item of cashbackAndCommissionArray" [ngValue]="item">{{ item?.name }}</option>
              </select>
            </div>
            <div class="mb-4">
              <label
                for="chargesAndCommission"
                class="block text-gray-700"
                style="font-size: 14px"
                >Select Charges & Commission</label
              >
              <select
              (ngModelChange)="chargesbackChanged($event)"
                formControlName="chargesAndCommission"
                class="mt-1 p-1 border rounded w-full focus:outline-none focus:ring-2 focus:ring-blue-500"
              >
                <option *ngFor="let item of chargesAndCommissionArray" [ngValue]="item">{{ item?.name }}</option>
              </select>
            </div>
          </div>
          <div class="w-1/2">
            <div class="mb-4">
              <label
                for="thirdPartyCharge"
                class="block text-gray-700"
                style="font-size: 14px"
                >Select Third Party Charge</label
              >
              <select
                formControlName="thirdPartyCharge"
                class="mt-1 p-1 border rounded w-full focus:outline-none focus:ring-2 focus:ring-blue-500"
              >
                <option disabled>--</option>
                <option *ngFor="let item of serviceArray" [ngValue]="item">{{ item?.name }}</option>
              </select>
              
            </div>
            <div class="mb-4">
              <label
                for="glAccount"
                class="block text-gray-700"
                style="font-size: 14px"
                >Select GL Account For Third Party Charge</label
              >
              <select
                formControlName="glAccount"
                class="mt-1 p-1 border rounded w-full focus:outline-none focus:ring-2 focus:ring-blue-500"
              >
                <option *ngFor="let item of serviceArray" [ngValue]="item">{{ item?.name }}</option>
              </select>
            </div>
            <div class="mb-4">
              <label
                for="feesCommission"
                class="block text-gray-700"
                style="font-size: 14px"
                >Select Fees & Commission</label
              >
              <select
              (ngModelChange)="feesChanged($event)"
                formControlName="feesCommission"
                class="mt-1 p-1 border rounded w-full focus:outline-none focus:ring-2 focus:ring-blue-500"
              >
                <option *ngFor="let item of feesAndCommissionArray" [ngValue]="item">{{ item?.name }}</option>
              </select>
            </div>
            <div class="mb-4">
              <label
                for="ptTaxComponent"
                class="block text-gray-700"
                style="font-size: 14px"
                >Select Tax & Commission</label
              >
              <select
              (ngModelChange)="taxChanged($event)"
                formControlName="ptTaxComponent"
                class="mt-1 p-1 border rounded w-full focus:outline-none focus:ring-2 focus:ring-blue-500"
              >
                <option *ngFor="let item of taxAndCommissionArray" [ngValue]="item">{{ item?.name }}</option>
              </select>
            </div>
          </div>
        </div>
      </div>
      <div class="float-end">
        <button
        (click)="onSubmit()"
          type="submit"
          class="bg-blue-500 text-white py-1 px-3 rounded hover:bg-blue-700"
        >
          Submit
        </button>
      </div>
    </form>
  </div>
