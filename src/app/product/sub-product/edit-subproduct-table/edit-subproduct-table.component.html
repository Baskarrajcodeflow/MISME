<div class="container mx-auto p-4 m-h-[100px] table-container">
  <form [formGroup]="form" >
    <div class="mb-4">
      <label for="name" class="block text-gray-700">Product Name</label>
      <input
        formControlName="name"
        type="text"
        id="name"
        class="mt-1 p-1 border rounded w-full focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
    </div>
    <div formArrayName="services">
      <div
        *ngFor="let service of services.controls; let i = index"
        [formGroupName]="i"
        class="flex gap-2 mt-4"
      >
  
        <div class="w-1/2 mt-[5px]">
          <div class="mb-4">
            <label
              for="service"
              class="block text-gray-700"
              style="font-size: 14px"
              >Service</label
            >
            <select 
            (ngModelChange)="serviceOnchage($event, i)"

              formControlName="service"
              class="mt-1 p-1 border rounded w-full focus:outline-none focus:ring-2 focus:ring-blue-500"
            >
              <option disabled>Select an option</option>
              <option *ngFor="let item of serviceArray" [ngValue]="item">{{ item?.name }}</option>
            </select>
          </div>
          <div class="mb-4">
            <label for="amountLimit" class="block text-gray-700" style="font-size: 14px">Select Amount Limit</label>
            <select   [compareWith]="compareById" (ngModelChange)="dataChanged($event)" formControlName="amountLimit" class="mt-1 p-1 border rounded w-full focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option [value]="null">----</option>
              <option *ngFor="let item of amountLimit" [ngValue]="item">{{ item?.name }}</option>
            </select>
          </div>
          <div class="mb-4">
            <label
              for="transactionLimit"
              class="block text-gray-700"
              style="font-size: 14px"
              >Select Transaction Limit</label
            >
            <select   [compareWith]="compareById" (ngModelChange)="transactionLimitChanged($event)"
              formControlName="transactionLimit"
              class="mt-1 p-1 border rounded w-full focus:outline-none focus:ring-2 focus:ring-blue-500"
            >
            <option>----</option>
              <option *ngFor="let item of transactionLimitArray" [ngValue]="item">{{ item?.name }}</option>
            </select>
          </div>
          <div class="mb-4">
            <label
              for="cashback"
              class="block text-gray-700"
              style="font-size: 14px"
              >Select Cashback & Commission</label
            >
            <select 
              [compareWith]="compareById"
            (ngModelChange)="cashbackChanged($event)"
              formControlName="cashback"
              class="mt-1 p-1 border rounded w-full focus:outline-none focus:ring-2 focus:ring-blue-500"
            >
            <option>----</option>
              <option *ngFor="let item of cashbackAndCommissionArray" [ngValue]="item">{{ item?.name }}</option>
            </select>
          </div>
          <div class="mb-4">
            <label
              for="chargesAndCommission"
              class="block text-gray-700"
              style="font-size: 14px"
              >Select Charges & Commission</label
            >
            <select
              [compareWith]="compareById"
              (ngModelChange)="chargesbackChanged($event)"
              formControlName="chargesAndCommission"
              class="mt-1 p-1 border rounded w-full focus:outline-none focus:ring-2 focus:ring-blue-500"
            >
              <option>----</option>
              <option *ngFor="let item of chargesAndCommissionArray" [ngValue]="item">{{ item?.name }}</option>
            </select>
            
          </div>
          <div class="mb-4" *ngIf="chargesbackChangedData">
            <label
              for="chargesGlAccountNo"
              class="block text-gray-700"
              style="font-size: 14px"
              >Select GL Account For Charges & Commission</label
            >
            <select
              formControlName="chargesGlAccountNo"
              class="mt-1 p-1 border rounded w-full focus:outline-none focus:ring-2 focus:ring-blue-500"
            >
            <option>----</option>
              <option *ngFor="let item of glAccountForChargesandCommission" [ngValue]="item">{{ item?.accountDescription }}</option>
            </select>
          </div>
        </div>
        <div class="w-1/2 mt-[5px]">
 
          <div class="mb-4">
            <label
              for="feesCommission"
              class="block text-gray-700"
              style="font-size: 14px"
              >Select Fees & Commission</label
            >
            <select
              [compareWith]="compareById"
              (ngModelChange)="feesChanged($event)"
              formControlName="feesCommission"
              class="mt-1 p-1 border rounded w-full focus:outline-none focus:ring-2 focus:ring-blue-500"
            >
            <option>----</option>
              <option *ngFor="let item of feesAndCommissionArray" [ngValue]="item">{{ item?.name }}</option>
            </select>
          </div>
          <div class="mb-4" *ngIf="feesChangedData">
            <label
              for="glAccount"
              class="block text-gray-700"
              style="font-size: 14px"
              >Select GL Account For Fees & Commission</label
            >
            <select
              formControlName="feesGlAccountNo"
              class="mt-1 p-1 border rounded w-full focus:outline-none focus:ring-2 focus:ring-blue-500"
            >
            <option>----</option>
              <option *ngFor="let item of glAccountForChargesandCommission" [ngValue]="item">{{ item?.accountDescription }}</option>
            </select>
          </div>
          <div class="mb-4">
            <label
              for="ptTaxComponent"
              class="block text-gray-700"
              style="font-size: 14px"
              >Select Tax & Commission</label
            >
            <select
              [compareWith]="compareById"
              (ngModelChange)="taxChanged($event)"
              formControlName="ptTaxComponent"
              class="mt-1 p-1 border rounded w-full focus:outline-none focus:ring-2 focus:ring-blue-500"
            >
            <option>----</option>
              <option *ngFor="let item of taxAndCommissionArray" [ngValue]="item">{{ item?.name }}</option>
            </select>
          </div>
          <div class="mb-4" *ngIf="taxChangedData">
            <label
              for="taxGlAccountNo"
              class="block text-gray-700"
              style="font-size: 14px"
              >Select GL Tax And Commission</label
            >
            <select
              [compareWith]="compareById"
              formControlName="taxGlAccountNo"
              class="mt-1 p-1 border rounded w-full focus:outline-none focus:ring-2 focus:ring-blue-500"
            >
            <option>----</option>
              <option *ngFor="let item of glAccountForChargesandCommission" [ngValue]="item">{{ item?.accountDescription }}</option>
            </select>
          </div>
   <div class="mb-4">
            <label
              for="ptLoyaltyComponent"
              class="block text-gray-700"
              style="font-size: 14px"
              >Select Loyalty</label
            >
            <select
              [compareWith]="compareById"
              (ngModelChange)="loyaltyChanged($event)"
              formControlName="ptLoyaltyComponent"
              class="mt-1 p-1 border rounded w-full focus:outline-none focus:ring-2 focus:ring-blue-500"
            >
            <option>----</option>
              <option *ngFor="let item of listLoyalty" [ngValue]="item">{{ item?.name }}</option>
            </select>
          </div>
             <div class="mb-4">
            <label
              for="ptReferralComponent"
              class="block text-gray-700"
              style="font-size: 14px"
              >Select Referral</label
            >
            <select
              [compareWith]="compareById"
              (ngModelChange)="referralChanged($event)"
              formControlName="ptReferralComponent"
              class="mt-1 p-1 border rounded w-full focus:outline-none focus:ring-2 focus:ring-blue-500"
            >
            <option>----</option>
              <option *ngFor="let item of listReferral" [ngValue]="item">{{ item?.name }}</option>
            </select>
          </div>
             <div class="mb-4">
            <label
              for="ptReferralBonusComponent"
              class="block text-gray-700"
              style="font-size: 14px"
              >Select Welcome Bonus</label
            >
            <select
              [compareWith]="compareById"
              (ngModelChange)="referralBonusChanged($event)"
              formControlName="ptReferralBonusComponent"
              class="mt-1 p-1 border rounded w-full focus:outline-none focus:ring-2 focus:ring-blue-500"
            >
            <option>----</option>
              <option *ngFor="let item of listReferralBonus" [ngValue]="item">{{ item?.name }}</option>
            </select>
          </div>
          <div class="float-right">
            <button
            type="button"
            class="bg-red-600 text-white py-1 px-3 rounded hover:bg-red-700"
            (click)="removeService(i)"
          >
            Remove
          </button>
          </div>
        </div>

      </div>
    </div>
    <button
    [disabled]="form.controls['name'].invalid"
      type="button"
      class="bg-blue-500 text-white py-1 px-3 rounded hover:bg-blue-700"
      (click)="addService()"
    >
      + Add Service
    </button>

    <div class="float-end pt-4">
      <button
      (click)="onSubmit()"
        type="submit"
        class="bg-blue-500 text-white py-1 px-3 rounded hover:bg-blue-700"
      >
        Edit 
      </button>
    </div>
  </form>
</div>
<app-loader *ngIf="isLoading"></app-loader>
