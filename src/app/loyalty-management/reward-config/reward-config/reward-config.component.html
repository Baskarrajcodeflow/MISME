<div class="p-6 bg-white rounded-xl shadow-md">
  <table class="min-w-full border border-gray-200 rounded-lg overflow-hidden">
    
    <!-- HEADER -->
    <thead class="bg-gray-900 text-white">
      <tr>
        <th class="px-5 py-3 text-left text-xs font-semibold tracking-wide uppercase">Name</th>
        <!-- <th class="px-5 py-3 text-left text-xs font-semibold tracking-wide uppercase">Min Txn Amount</th> -->
        <th class="px-5 py-3 text-left text-xs font-semibold tracking-wide uppercase">Max Limit</th>
        <th class="px-5 py-3 text-left text-xs font-semibold tracking-wide uppercase">Expiry Days</th>
        <th class="px-5 py-3 text-left text-xs font-semibold tracking-wide uppercase">Amount / Point</th>
        <!-- <th class="px-5 py-3 text-left text-xs font-semibold tracking-wide uppercase">Points / Transaction</th> -->
        <th class="px-5 py-3 text-left text-xs font-semibold tracking-wide uppercase">Actions</th>
      </tr>

      <!-- FILTER ROW -->
      <tr class="bg-gray-100 border-b border-gray-300">
        <th class="px-5 py-2">
          <input 
          [(ngModel)]="loyaltyName"
            type="text" 
            placeholder="Name" 
  class="w-full px-3 py-2 border border-gray-300 rounded-lg text-black focus:ring-2 focus:ring-blue-400"
          />
        </th>
        <!-- <th class="px-5 py-2">
          <input 
          [(ngModel)]="minAmount"
            type="number" 
            placeholder="Min Amount" 
  class="w-full px-3 py-2 border border-gray-300 rounded-lg text-black focus:ring-2 focus:ring-blue-400"
          />
        </th> -->

        <th class="px-5 py-2">
          <input 
          [(ngModel)]="maxLimit"
            type="number" 
            placeholder="Max Limit" 
  class="w-full px-3 py-2 border border-gray-300 rounded-lg text-black focus:ring-2 focus:ring-blue-400"
          />
        </th>

        <th class="px-5 py-2">
          <input 
          [(ngModel)]="expiryDays"
            type="number" 
            placeholder="Days" 
  class="w-full px-3 py-2 border border-gray-300 rounded-lg text-black focus:ring-2 focus:ring-blue-400"
          />
        </th>

        <th class="px-5 py-2">
          <input 
          [(ngModel)]="amountPerPoint"
            type="number" 
            placeholder="Amt/Point" 
  class="w-full px-3 py-2 border border-gray-300 rounded-lg text-black focus:ring-2 focus:ring-blue-400"
          />
        </th>

        <!-- <th class="px-5 py-2">
          <input 
          [(ngModel)]="pointsPerTransaction"
            type="number" 
            placeholder="Pts/Txn" 
  class="w-full px-3 py-2 border border-gray-300 rounded-lg text-black focus:ring-2 focus:ring-blue-400"
          />
        </th> -->

        <th class="px-5 py-2">
          <button 
          (click)="saveConfig()"
            class="px-4 py-2 text-sm font-medium bg-blue-600 text-white rounded-lg cursor-pointer hover:bg-blue-700 transition">
            Add
          </button>
        </th>
      </tr>
    </thead>

    <!-- BODY -->
    <tbody class="divide-y divide-gray-200 text-gray-700">

      <tr class="hover:bg-gray-50 transition" *ngFor="let config of rewardConfigs">
        <td class="px-5 py-4 font-medium">{{ config.name }}</td>
        <!-- <td class="px-5 py-4">{{ config.minTransactionAmount }}</td> -->
        <td class="px-5 py-4">{{ config.maxLimit }}</td>
        <td class="px-5 py-4">{{ config.expiryDays }}</td>
        <td class="px-5 py-4">{{ config.amountPerPoint }}</td>
        <td class="px-5 py-4">
           <button 
          (click)="approve(config)"
            class="px-4 py-2 text-sm font-medium bg-green-600 text-white rounded-lg cursor-pointer hover:bg-green-700 transition">
            Approve
          </button>
        </td>

        <!-- <td class="px-5 py-4">
          <button 
            class="text-blue-600 hover:text-blue-800 transition">
            <i class="fas fa-edit"></i>
          </button>
        </td> -->
      </tr>

    </tbody>
  </table>
</div>
