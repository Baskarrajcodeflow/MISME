<div style="margin-top: 1px; padding: 10px; display: flex; justify-content: center;">
    <div class="row" style="width: 100%;">
        <div class="col-lg-12 grid-margin stretch-card">
            <div class="card" style="border-color: rgb(244, 248, 248); border-radius: 30px; width: 100%; display: flex; flex-direction: column; min-height: 500px;">
                <div class="card-body" style="flex-grow: 1;">
                    <h5 class="card-title p-1" style="color: rgb(10, 54, 90);">Bulk Salary List</h5>
                    <table class="table" style="border: 1px solid #dee2e6; border-collapse: collapse; width: 100%;">
                        <thead>
                            <tr style="background-color: rgb(10, 54, 90); color: white;">
                                <th class="table-header">Wallet Number</th>
                                <th class="table-header">Amount</th>
                                <!-- <th class="table-header">Action</th> -->
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let item of bulkSalaryData">
                                <td class="table-data">{{ item?.['WALLET'] }}</td>
                                <td class="table-data">{{ item?.['AMOUNT'] }}</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div *ngIf="privilege?.authorizePrivelege" class="mb-2 mt-2 w-full" style="display: flex; justify-content: flex-end; padding: 10px; margin-top: auto;">
                    <button (click)="authorizeSalaryProcess(1)" type="submit" class="px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white focus:outline-none focus:ring-2 focus:ring-offset-2" style="background-color: #0a365a; margin-right: 10px;">
                        Authorize
                    </button>
                    <button (click)="authorizeCustomeronboarding(0)" type="submit" class="px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white focus:outline-none focus:ring-2 focus:ring-offset-2" style="background-color: #0a365a;">
                        Cancel
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
