<div class="overflow-x-auto">
    <table class="min-w-full table-auto border-collapse bg-blue border border-gray-300 rounded-lg shadow-md">
      <thead style="background-color: rgb(10, 54, 90)">
        <tr>
          <th
            scope="col"
            class="px-6 py-3 text-center text-xs font-semibold text-white uppercase tracking-wider"
          >
            Id
          </th>
          <th
            scope="col"
            class="px-6 py-3 text-center text-xs font-semibold text-white uppercase tracking-wider"
          >
            Uploaded Date
          </th>
          <th
            scope="col"
            class="px-6 py-3 text-center text-xs font-semibold text-white uppercase tracking-wider"
          >
            Service Name
          </th>
          <th
          scope="col"
          class="px-6 py-3 text-center text-xs font-semibold text-white uppercase tracking-wider"
        >
          Rejected Reason
        </th>
          <th
            scope="col"
            class="px-6 py-3 text-center text-xs font-semibold text-white uppercase tracking-wider"
          >
            Action
          </th>
        </tr>
      </thead>
      <tbody class="bg-white divide-y divide-gray-200">
        <tr
          *ngFor="let item of bulkTopupData"
          class="hover:bg-gray-100 cursor-pointer text-sm"
        >
        <ng-container *ngIf="item?.status == 2">
            <td class="px-6 py-3 text-center whitespace-nowrap font-medium text-gray-800">
              {{ item.id }}
            </td>
            <td class="px-6 py-3 text-center whitespace-nowrap text-gray-700">
              <div>{{ item?.uploadedDateTime | date:'MMM d, y' }}</div>
              <div class="text-sm text-gray-500">
                {{ item?.uploadedDateTime | date:'h:mm:ss a' }}
              </div>
            </td>
            <td class="px-6 py-3 text-center whitespace-nowrap text-gray-800">
              {{ item.serviceName }}
            </td>
            <td class="px-6 py-3 text-center whitespace-nowrap text-gray-800">
                {{ item.rejectReason }}
              </td>
            <td class="px-6 py-3 text-center whitespace-nowrap">
              <button
              (click)="openDialog(item)"
                mat-icon-button
                color="primary"
                matTooltip="View Details"
                class="text-blue-600 hover:text-blue-800"
              >
                <mat-icon>visibility</mat-icon>
              </button>
            </td>
        </ng-container>
        
        </tr>
      </tbody>
    </table>
  </div>
  
  <app-loader *ngIf="isLoading"></app-loader>
