<div class="container mx-auto p-4 m-h-[100px] table-container">
    <form [formGroup]="transactionForm">
        <div>
            <div class="mb-4">
                <label for="service" class="block text-gray-700" style="font-size: 14px">Account Number</label>
                <input formControlName="accNO" for type="text" id="name"
                    class="mt-1 p-1 border rounded w-full focus:outline-none focus:ring-2 focus:ring-blue-500"
                    value="{{accNoResponse}}" readonly />
            </div>

            <div class="flex gap-4 mt-4">
                <div class="w-1/2">

                    <div class="mb-4">
                        <label class="block text-gray-700" style="font-size: 14px">Type</label>
                        <select formControlName="type"
                            class="mt-1 p-1 border rounded w-full focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option>----</option>
                            <option value="ASSET">Asset</option>
                            <option value="LIABILITY">Liability</option>
                            <option value="INCOME">Income</option>
                            <option value="EXPENSE">Expense</option>
                        </select>
                    </div>
                    <div class="mb-4">
                        <label for="service" class="block text-gray-700" style="font-size: 14px">Description</label>
                        <input formControlName="desc" for type="text" id="name"
                            class="mt-1 p-1 border rounded w-full focus:outline-none focus:ring-2 focus:ring-blue-500" />
                    </div>
                    <div class="mb-4" *ngIf="parentSubHead">
                        <label class="block text-gray-700" style="font-size: 14px">Select Sub head</label>
                        <select formControlName="category" (change)="onChangeSubHeads($event)"
                            class="mt-1 p-1 border rounded w-full focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option>----</option>
                            <option *ngFor="let s of subHeads" [value]="s?.id">
                                {{s?.accountNo}}|{{s?.accountDescription}}</option>
                            <!-- <option>CUSTOMER</option> -->
                        </select>
                    </div>

                </div>
                <div class="w-1/2">
                    <div class="mb-4">
                        <label class="block text-gray-700" style="font-size: 14px">Select Category</label>
                        <select formControlName="category" (change)="onChangeCategory($event)"
                            class="mt-1 p-1 border rounded w-full focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option>----</option>
                            <option value="HEAD">Head</option>
                            <option value="SUBHEAD">Sub Head</option>
                            <option value="LEAF">Leaf</option>
                        </select>
                    </div>

                    <!-- <div class="mb-4">
                        <label for="service" class="block text-gray-700" style="font-size: 14px">Account Number</label>
                        <input formControlName="accNO" for type="text" id="name"
                            class="mt-1 p-1 border rounded w-full focus:outline-none focus:ring-2 focus:ring-blue-500" />
                    </div> -->
                    <div class="mb-4" *ngIf="parentHead">
                        <label class="block text-gray-700" style="font-size: 14px">Select Parent Head</label>
                        <select formControlName="category" (change)="onChangeParentHead($event)"
                            class="mt-1 p-1 border rounded w-full focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option>----</option>
                            <option *ngFor="let h of heads" [value]="h?.id">
                                {{h?.accountNo}}|{{h?.accountDescription}}</option>
                        </select>
                    </div>

                </div>
            </div>
        </div>
        <div *ngIf="alertMessage" [ngClass]="{
            'bg-green-100 border-green-500 text-green-700': alertType === 'success',
            'bg-red-100 border-red-500 text-red-700': alertType === 'error'
          }" class="p-4 mb-4 rounded-md border-l-4 flex justify-between items-center">
            <span>{{ alertMessage }}</span>
            <button (click)="closeAlert()" class="text-xl font-bold">&times;</button>
        </div>
        <div class="float-left" *ngIf="headSubmit">
            <button (click)="submit()" type="submit" class="bg-blue-500 text-white py-1 px-3 rounded hover:bg-blue-700">
                Submit Head
            </button>
        </div>
        <div class="float-left" *ngIf="categoryValue==='SUBHEAD'">
            <button (click)="submit()" type="submit" class="bg-blue-500 text-white py-1 px-3 rounded hover:bg-blue-700">
                Submit Subhead
            </button>
        </div>
        <div class="float-left" *ngIf="categoryValue==='LEAF'">
            <button (click)="submit()" type="submit" class="bg-blue-500 text-white py-1 px-3 rounded hover:bg-blue-700">
                Submit Leaf
            </button>
        </div>
    </form>
</div>
