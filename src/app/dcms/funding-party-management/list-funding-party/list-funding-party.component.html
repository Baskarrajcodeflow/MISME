    <div>
        <h5 class="page-title text-xl font-bold mb-4">List Funding Party</h5>
        <br>
        <table class="min-w-full bg-blue border border-gray-300">
            <thead style="background-color: rgb(10, 54, 90);">
                <tr>
                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider">
                        Funding Party Id</th>
                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider">
                        Email</th>
                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider">
                        UserName</th>
                      <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider">
                        First Name</th>
                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider">
                        Account Number</th>
                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider">
                        Gender</th>
                </tr>
            </thead>
            <tbody class="bg-white divide-y divide-gray-200">
                <tr *ngFor="let c of fundingPartyList" class="hover:bg-gray-100 cursor-pointer divide-x">
                    <td class="px-2 py-1 text-sm whitespace-nowrap">{{ c.id }}</td>
                    <td class="px-2 py-1 text-sm whitespace-nowrap">{{ c.email }}</td>
                    <td class="px-2 py-1 text-sm whitespace-nowrap">{{ c.username }}</td>
                    <td class="px-2 py-1 text-sm whitespace-nowrap">{{ c.firstName }}</td>
                    <td class="px-2 py-1 text-sm whitespace-nowrap">{{ c.walletAccount?.accountNo }}</td>
                    <td class="px-2 py-1 text-sm whitespace-nowrap">{{ c.gender }}</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
