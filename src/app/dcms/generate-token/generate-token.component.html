<div class="container">
    <div class="page-header"></div>
    <div class="row">
        <div class="col-md-12 grid-margin stretch-card">
            <div class="card shadow-lg rounded-lg p-6 bg-white">
                <div class="card-body">
                    <h5 class="page-title text-xl font-bold mb-4">Generate Token</h5>
                    <form [formGroup]="generateTokenForm" (ngSubmit)="fetch()">
                        <div class="flex flex-wrap -mx-2">
                            <div class="w-full sm:w-1/2 px-2 mb-4">
                                <label for="project" class="block text-gray-700 font-bold mb-2">Select Project</label>
                                <select id="project" formControlName="project" class="w-full px-3 py-2 border rounded">
                                    <option value="">-- Select --</option>
                                    <!-- <option *ngFor="let p of projectList" [value]="p">{{ p }}</option> -->
                                    <option value="">Project Test 1</option>
                                    <option value="">Project Test 2</option>
                                    <option value="">Project Test 3</option>
                                </select>
                            </div>
                            <div class="w-full sm:w-1/2 px-2 mb-4">
                                <label for="subproject" class="block text-gray-700 font-bold mb-2">Select Subproject
                                </label>
                                <select id="subproject" formControlName="subproject"
                                    class="w-full px-3 py-2 border rounded">
                                    <option value="">-- Select --</option>
                                    <!-- <option *ngFor="let s of subprojectList" [value]="s">{{ s }}</option> -->
                                    <option value="">Subproject 1</option>
                                    <option value="">Subproject 2</option>
                                    <option value="">Subproject 3</option>
                                </select>
                            </div>
                            <div class="w-full px-2 text-right">
                                <button type="submit" [disabled]="generateTokenForm.invalid"
                                    style="background-color: #0a365a;float: right;"
                                    class="mt-4 px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">
                                    Fetch
                                </button>
                            </div>
                        </div>
                    </form>
                    <table *ngIf="showTable" class="min-w-full bg-blue border border-gray-300">
                        <thead style="background-color: rgb(10, 54, 90);">
                            <tr>
                                <th scope="col"
                                    class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider">
                                    ID</th>
                                <th scope="col"
                                    class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider">
                                    Email</th>
                                <th scope="col"
                                    class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider">
                                    Username</th>
                                <th scope="col"
                                    class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider">
                                    First Name</th>
                                <th scope="col"
                                    class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider">
                                    Last Name</th>
                                <th scope="col"
                                    class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider">
                                    Gender</th>
                                <th scope="col"
                                    class="px-6 py-3 text-left text-xs font-medium text-white uppercase tracking-wider">
                                    Phone</th>
                            </tr>
                        </thead>
                        <tbody class="bg-white divide-y divide-gray-200">
                            <tr *ngFor="let c of beneficiaryList" class="hover:bg-gray-100 cursor-pointer divide-x">
                                <td class="px-2 py-1 text-sm whitespace-nowrap">{{ c.id }}</td>
                                <td class="px-2 py-1 text-sm whitespace-nowrap">{{ c.email }}</td>
                                <td class="px-2 py-1 text-sm whitespace-nowrap">{{ c.username }}</td>
                                <td class="px-2 py-1 text-sm whitespace-nowrap">{{ c.firstName }}</td>
                                <td class="px-2 py-1 text-sm whitespace-nowrap">{{ c.lastName }}</td>
                                <td class="px-2 py-1 text-sm whitespace-nowrap">{{ c.gender }}</td>
                                <td class="px-2 py-1 text-sm whitespace-nowrap">{{ c.phone }}</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
