<!-- One sidebar menu: a direct link (module with a single link) or an accordion of sub-links. Styles are in sidebar-item.component.css -->

<!-- Icon and module name, shared by the direct link and the accordion header -->
<ng-template #label>
  <!-- The icon image, drawn in the row's text colour (see iconMask) -->
  <span class="icon" [style.mask]="iconMask" [style.-webkit-mask]="iconMask" aria-hidden="true"></span>
  <span class="name">{{ module.name }}</span>
</ng-template>

<!-- Module with a single link: the module itself is the link, no dropdown -->
<a
  *ngIf="directLink as link"
  class="row"
  [class.active]="isDirectLinkActive"
  [routerLink]="link.name"
  [queryParams]="link.queryParams"
  (click)="getRouteLink(); getComponentName(link.name)"
  [attr.aria-current]="isDirectLinkActive ? 'page' : null"
>
  <ng-container *ngTemplateOutlet="label"></ng-container>
</a>

<!-- Accordion header: opens and closes the sub-links -->
<button
  *ngIf="!directLink"
  type="button"
  class="row"
  [class.open]="isOpen"
  [class.has-active]="activeLinkName"
  (click)="this.isOpen = !this.isOpen; toggleDropdown()"
  [attr.aria-expanded]="isOpen"
>
  <ng-container *ngTemplateOutlet="label"></ng-container>

  <!-- Chevron Icon -->
  <svg
    *ngIf="module.components?.length != 0"
    class="chevron"
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 20 20"
    fill="currentColor"
    aria-hidden="true"
  >
    <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
  </svg>
</button>

<!-- Sub-links. The grid row animates between 0 and the content's height; inert keeps closed links out of keyboard focus -->
<div
  *ngIf="!directLink && module.components?.length != 0"
  #dropdownMenu
  class="sub"
  [class.open]="isOpen"
  [attr.inert]="isOpen ? null : ''"
>
  <div class="sub-clip">
    <div class="sub-links">
      <a
        *ngFor="let feature of module.components"
        class="sub-link"
        [class.active]="feature.name === activeLinkName"
        [routerLink]="feature.name"
        [queryParams]="feature.queryParams"
        (click)="getRouteLink()"
        (click)="getComponentName(feature?.name)"
        [attr.aria-current]="feature.name === activeLinkName ? 'page' : null"
      >
        {{ feature.displayLink }}
      </a>
    </div>
  </div>
</div>
